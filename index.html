<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Squishy Hunt</title>
<style>
  :root { --ink:#3a2a22; --paper:#fffaf0; --yellow:#ffcf33; --sky:#8ecbff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#6eb6ee; color:var(--ink);
    font-family:"Trebuchet MS","Comic Sans MS","Chalkboard SE","Segoe UI",sans-serif;
    overscroll-behavior:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  body { overflow:hidden; user-select:none; }
  #app { height:100%; height:var(--app-h, 100%); display:flex; flex-direction:column; touch-action:none; }
  #stage { flex:1; min-height:0; position:relative; background:#8ecbff; }
  #c { display:block; width:100%; height:100%; touch-action:none; }
  .faces canvas { width:120px; height:130px; }
  .char canvas { width:140px; height:150px; }
  #fade { position:absolute; inset:0; background:#3a2a22; opacity:0; pointer-events:none; transition:opacity .18s; z-index:4; }
  #fade.on { opacity:1; }
  #hud { position:absolute; z-index:5; left:8px; right:8px; top:8px; display:flex; flex-wrap:wrap; gap:6px; pointer-events:none; }
  #hud.hidden { display:none; }
  .pill { pointer-events:auto; background:rgba(255,250,240,.94); border:3px solid var(--ink); border-radius:999px;
    padding:4px 10px; font-weight:800; color:var(--ink); font-size:14px; font-family:inherit; }
  button.pill { cursor:pointer; }
  #objective { flex:1 0 100%; border-radius:14px; text-align:center; pointer-events:none; }
  .pill i { display:inline-block; width:9px; height:9px; border-radius:50%; margin:0 1px; border:1px solid var(--ink); opacity:.28; vertical-align:middle; }
  .pill i.on { opacity:1; }
  #toast { position:absolute; z-index:6; top:78px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:8px 12px; border-radius:12px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:92%; text-align:center; font-weight:700; }
  #toast.show { opacity:1; }
  #dialog { position:absolute; z-index:7; left:10px; right:10px; bottom:10px; background:var(--paper);
    border:4px solid var(--ink); border-radius:18px; padding:10px 12px 12px; box-shadow:0 6px 0 rgba(0,0,0,.12); }
  #dialog.hidden { display:none; }
  @media (hover: hover) and (pointer: fine) {
    #dialog { position:fixed; left:50%; right:auto; bottom:auto; top:50%; transform:translate(-50%, -50%);
      width:min(520px, calc(100% - 32px)); max-height:min(70vh, 420px); overflow:auto; z-index:20; }
    #d-next { min-width:120px; min-height:48px; font-size:18px; }
  }
  #d-who { font-weight:900; color:#b4236a; min-height:1em; }
  #d-text { margin:4px 0 8px; font-size:18px; line-height:1.35; }
  #bar { display:flex; align-items:center; justify-content:center; gap:8px;
    padding:6px 10px calc(6px + env(safe-area-inset-bottom)); background:#fff6e4; border-top:4px solid var(--ink); }
  #bar.hidden { display:none; }
  #midbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  button { font-family:inherit; font-weight:800; color:var(--ink); border:3px solid var(--ink); background:#fff; border-radius:16px; cursor:pointer;
    touch-action:manipulation; -webkit-user-select:none; }
  button:active { filter:brightness(.92); }
  button:focus-visible { outline:4px solid #3a8bff; outline-offset:2px; }
  #midbtns button { min-width:88px; height:56px; font-size:16px; padding:6px 12px; }
  @media (pointer: coarse) {
    #midbtns button { min-width:104px; height:64px; font-size:18px; }
  }
  #modal { position:fixed; inset:0; z-index:30; background:rgba(24,40,70,.4); display:flex; align-items:center; justify-content:center; padding:12px; }
  #modal.hidden { display:none; }
  .card { background:var(--paper); border:4px solid var(--ink); border-radius:24px; max-width:920px; width:min(920px,100%);
    max-height:min(92dvh,920px); overflow:auto; padding:16px 16px 20px; touch-action:pan-y; box-shadow:0 10px 0 rgba(0,0,0,.15); }
  .card h1, .card h2 { margin:4px 0 8px; text-align:center; }
  .card p { font-size:18px; line-height:1.4; margin:8px 0; }
  .card .row { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:12px 0; }
  .faces { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .offer { display:block; margin:0 auto; background:#fff; border-radius:18px; }
  button.kidpick { min-width:112px; min-height:156px; padding:6px 6px 8px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:16px; }
  button.kidpick canvas.face { width:86px; height:92px; }
  button.kidpick canvas.want { width:64px; height:46px; }
  .char { width:150px; background:#fff; border:3px solid var(--ink); border-radius:18px; padding:6px; text-align:center; }
  .char h3 { margin:0; }
  .char canvas { width:140px; height:150px; }
  .card > button, .card .primary { background:var(--yellow); min-height:52px; padding:8px 16px; font-size:18px; margin:6px; }
  .ghost { background:#fff !important; }
  .choices, .grid { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:10px 0; }
  .choice { min-width:84px; min-height:84px; font-size:28px; padding:8px; }
  .choice.lit { transform:scale(1.08); box-shadow:0 0 0 4px #fff, 0 0 0 8px var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(4, minmax(64px,1fr)); }
  .tbar { position:relative; height:36px; border-radius:20px; background:#efe6d6; border:3px solid var(--ink); overflow:hidden; margin:16px 8px; }
  .zone { position:absolute; left:32%; width:36%; top:0; bottom:0; background:#9be59a; }
  .needle { position:absolute; top:0; width:8px; height:100%; background:var(--ink); border-radius:4px; }
  .bigwin { font-size:42px; text-align:center; margin:8px; }
  .goals { list-style:none; padding:0; margin:0; }
  .goals li { padding:8px 10px; border-radius:12px; margin:6px 0; background:#fff; border:3px solid #eadfce; font-weight:700; }
  .goals li.done { background:#e5f8df; }
  .pips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .pip { width:78px; height:78px; border-radius:50%; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:12px; font-weight:800; border:3px solid var(--ink); background:#e6e0d6; color:#fff; }
  .pip.got { background:var(--c); color:#3a2a22; }
  .pip.rare { box-shadow:0 0 0 4px gold; }
  .slots { display:flex; gap:8px; justify-content:center; margin:8px 0; }
  .slot, .sample span { width:64px; height:64px; border:3px dashed var(--ink); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:32px; background:#fff; }
  .skybox, .pondbox, .pit { position:relative; height:180px; overflow:hidden; border:3px solid var(--ink); border-radius:16px; background:#b9e6ff; margin:8px 0; }
  .pondbox { background:#7ec8ea; }
  .pit { background:#f0d59a; height:220px; }
  .dig-scene { width:100%; max-width:860px; height:auto; display:block; margin:8px auto; border:3px solid var(--ink); border-radius:16px; background:#8ecbff; }
  .card > button.dig-go { min-width:220px; min-height:84px; font-size:32px; }
  .slide-stage { position:relative; height:260px; overflow:hidden; border:3px solid var(--ink); border-radius:16px; background:#d7f3ff; margin:8px 0; touch-action:manipulation; }
  .slide-stage.coral { background:#ffe4d8; }
  .slide-tower { position:absolute; left:3%; top:6%; width:58px; height:64px; background:#f7f1e4; border:3px solid var(--ink); border-radius:10px 10px 0 0; pointer-events:none; z-index:1; }
  .slide-ladder { position:absolute; left:5.2%; top:30%; width:26px; bottom:8%; border-left:4px solid var(--ink); border-right:4px solid var(--ink); background:repeating-linear-gradient(#c9843a 0 5px, transparent 5px 16px); pointer-events:none; }
  .slide-ramp { position:absolute; border-radius:14px; border:3px solid var(--ink); transform-origin:left center; box-shadow:inset 0 6px 0 rgba(255,255,255,.45); }
  .slide-kid { position:absolute; z-index:3; font-size:46px; line-height:1; width:48px; margin-left:-24px; margin-top:-42px; text-align:center; pointer-events:none; transform-origin:50% 100%; transform:rotate(16deg); }
  .slide-prize { position:absolute; z-index:2; width:54px; height:48px; margin-left:-27px; margin-top:-44px; border-radius:50%; border:3px solid var(--ink); pointer-events:none; box-shadow:0 0 0 4px rgba(255,207,51,.9); }
  .card > button.slide-grab { min-width:220px; min-height:84px; font-size:32px; padding:12px 28px; background:var(--yellow); }
  .mover { position:absolute; font-size:42px; }
  .mem { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .swatch { width:84px; height:64px; margin:6px auto; border:3px solid var(--ink); border-radius:14px; }
  .shelf-row { display:flex; gap:6px; justify-content:center; min-height:36px; margin:8px 0; flex-wrap:wrap; }
  .shelf-row i { width:28px; height:36px; border-radius:4px; border:2px solid var(--ink); display:inline-block; }
  .belt, .river { position:relative; height:140px; overflow:hidden; border:3px solid var(--ink); border-radius:16px; margin:8px 0; touch-action:manipulation; }
  .belt { background:#fff6e4; }
  .river { background:#7ec8ea; border-color:#2a6496; }
  .belt button, .river button { position:absolute; top:28px; width:84px; height:84px; font-size:40px; padding:0; }
  .xray-find { display:flex; align-items:center; justify-content:center; gap:14px; font-size:22px; font-weight:800; margin:6px 0; }
  .xray-find b { width:96px; height:96px; display:flex; align-items:center; justify-content:center; font-size:64px; line-height:1; background:#fff; border:4px solid var(--ink); border-radius:20px; }
  .xray { position:relative; height:210px; border:4px solid #1c2430; border-radius:16px; overflow:hidden; touch-action:manipulation; margin:8px 0;
    background:linear-gradient(#2a3340 0 40px, #4a3b2a 40px 58px, #6e5638 58px 100%); }
  .xray-glow { position:absolute; left:30%; width:40%; top:44px; bottom:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(110,255,170,.22) 0 8px, rgba(110,255,170,.05) 8px 16px); }
  .xray-arch { position:absolute; left:30%; width:40%; top:6px; bottom:16px; z-index:4; pointer-events:none;
    border:4px solid #c5d0dc; border-bottom:none; border-radius:16px 16px 0 0; box-shadow:inset 0 0 0 3px #1b2836; }
  .xray-arch span { position:absolute; top:4px; left:0; right:0; text-align:center; color:#b7ffcf; font-size:15px; letter-spacing:2px; font-weight:900; }
  .xray-case { position:absolute; top:68px; width:100px; height:100px; padding:0; border-radius:16px; border:3px solid var(--ink);
    font-size:54px; line-height:1; z-index:3; display:flex; align-items:center; justify-content:center; }
  .xray-case::before { content:''; position:absolute; top:-16px; left:50%; width:42px; height:18px; margin-left:-21px;
    border:3px solid var(--ink); border-bottom:none; border-radius:10px 10px 0 0; background:inherit; }
  .xray-case.scanning { background:#062015 !important; border-color:#7dffb0; box-shadow:0 0 0 4px rgba(80,255,150,.55), inset 0 0 16px rgba(80,255,150,.4); }
  .xray-item { pointer-events:none; }
  .wanted { font-size:68px; text-align:center; line-height:1; margin:4px 0; }
  .rhythm { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .rhythm button { width:96px; height:96px; font-size:40px; }
  .rhythm button.hot { box-shadow:0 0 0 6px #ffcf33; transform:scale(1.06); }
  .rhythm button.dim { opacity:.45; }
  .boards { display:flex; gap:18px; justify-content:center; flex-wrap:wrap; align-items:flex-start; }
  .board { display:grid; gap:6px; }
  .board.n4 { grid-template-columns:repeat(2, 72px); }
  .board.n6 { grid-template-columns:repeat(3, 64px); }
  .board button { width:100%; height:64px; padding:0; }
  .pips-row { display:flex; gap:5px; justify-content:center; margin:6px 0; }
  .pips-row b { width:16px; height:16px; border-radius:50%; border:2px solid var(--ink); display:inline-block; background:#fff; }
  .hopgrid { display:grid; grid-template-columns:repeat(4, 80px); gap:8px; justify-content:center; }
  .hopgrid button { width:80px; height:80px; font-size:22px; }
  .passes { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .passcard { display:flex; gap:2px; padding:8px; border:4px solid var(--ink); border-radius:16px; background:#fff; }
  .passcard span { width:42px; height:48px; display:flex; align-items:center; justify-content:center; font-size:26px; }
  .mem button { min-height:78px; font-size:34px; }
  .swingbox { height:200px; position:relative; border-bottom:4px solid var(--ink); }
  .peek-row { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:12px 0; touch-action:manipulation; }
  .peek-door { position:relative; width:128px; height:180px; padding:78px 8px 10px; background:#8a5a32; color:#fff8e6; font-size:20px; border-radius:16px; }
  .peek-face { position:absolute; left:50%; top:18px; transform:translateX(-50%); font-size:48px; line-height:1; pointer-events:none; opacity:0; }
  .peek-door.hot { background:#c9843a; box-shadow:0 0 0 6px #ffcf33; }
  .peek-door.hot .peek-face { opacity:1; }
  .peek-door.reading { background:#6b3a22; }
  .peek-door.reading .peek-face { opacity:1; top:48px; }
  .card > button.story-go { min-width:240px; min-height:84px; font-size:30px; background:var(--yellow); }
  .lesson-q { font-size:34px; font-weight:900; text-align:center; letter-spacing:.5px; margin:10px 0 4px; }
  .card p.lesson-status { text-align:center; font-weight:800; }
  .rope { position:absolute; left:50%; top:0; width:4px; height:120px; background:var(--ink); transform-origin:top center; }
  .seat { position:absolute; left:-18px; top:110px; font-size:40px; }
  #err { display:none; position:fixed; z-index:80; left:0; right:0; bottom:0; background:#ffd6d6; color:#600; padding:8px; white-space:pre-wrap; font-size:12px; }
  #autotest { position:fixed; z-index:70; left:8px; bottom:8px; background:#fff; padding:8px; max-width:90vw; }
  .plan { width:100%; height:auto; background:#fff8e6; border:3px solid var(--ink); border-radius:12px; }
  #modal.ending { align-items:flex-start; background:transparent; }
  #modal.ending .card { max-width:640px; margin-top:8px; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .shake { animation:shake .28s; }
  @media (min-width:721px) { #midbtns .ico { display:none; } }
  @media (max-width:720px) {
    #midbtns button { min-width:64px; height:52px; font-size:16px; }
    #midbtns .lbl { display:none; }
    #d-text { font-size:16px; }
    .char { width:46%; }
  }
  @media (max-height:520px) {
    #midbtns button { height:48px; }
    #hud { top:4px; }
    .pill { font-size:12px; padding:2px 8px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" width="960" height="540"></canvas>
    <div id="fade"></div>
    <div id="hud">
      <button type="button" id="who" class="pill">Friends</button>
      <span id="roompill" class="pill">Room</span>
      <button type="button" id="sc-school" class="pill">School</button>
      <button type="button" id="sc-park" class="pill">Park</button>
      <button type="button" id="sc-air" class="pill">Airport</button>
      <button type="button" id="sc-star" class="pill">Stars</button>
      <div id="objective" class="pill">Let's go</div>
    </div>
    <div id="toast"></div>
    <div id="dialog" class="hidden">
      <div id="d-who"></div>
      <p id="d-text"></p>
      <button type="button" id="d-next">Next</button>
    </div>
  </div>
  <div id="bar">
    <div id="midbtns">
      <button type="button" id="btn-goals" aria-label="Goals"><span class="lbl">Goals</span><span class="ico">★</span></button>
      <button type="button" id="btn-bag" aria-label="Bag"><span class="lbl">Bag</span><span class="ico">🎒</span></button>
      <button type="button" id="btn-plan" aria-label="Plan"><span class="lbl">Plan</span><span class="ico">🗺️</span></button>
    </div>
  </div>
</div>
<div id="modal" class="hidden"></div>
<div id="err"></div>
<script>
'use strict';
const SAVE = 'squishy-escape-v1';
const UNLOCK = 'squishy-escape-unlock-v1';
const params = new URLSearchParams(location.search);
const DEBUG = params.has('debug');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const SQUISHIES = [
  {id:'pink', name:'Pink', set:'school', hex:'#ff6fae'},
  {id:'blue', name:'Blue', set:'school', hex:'#4aa8ff'},
  {id:'purple', name:'Purple', set:'school', hex:'#b06bff'},
  {id:'yellow', name:'Yellow', set:'school', hex:'#ffd23f'},
  {id:'orange', name:'Orange', set:'school', hex:'#ff8a2a'},
  {id:'red', name:'Red', set:'school', hex:'#ff4d4d'},
  {id:'gold', name:'Gold', set:'school', hex:'#ffc107', rare:true},
  {id:'mint', name:'Mint', set:'park', hex:'#7dffa8'},
  {id:'lavender', name:'Lavender', set:'park', hex:'#c9b6ff'},
  {id:'coral', name:'Coral', set:'park', hex:'#ff7f6e'},
  {id:'sky', name:'Sky', set:'park', hex:'#8fd3ff'},
  {id:'lemon', name:'Lemon', set:'park', hex:'#fff06a'},
  {id:'lilac', name:'Lilac', set:'park', hex:'#e7a6ff'},
  {id:'rainbow', name:'Rainbow', set:'park', hex:'#ff7ad9', rare:true, rainbow:true},
  {id:'teal', name:'Teal', set:'air', hex:'#2ec4b6'},
  {id:'magenta', name:'Magenta', set:'air', hex:'#ff4fa3'},
  {id:'peach', name:'Peach', set:'air', hex:'#ffc2a1'},
  {id:'navy', name:'Navy', set:'air', hex:'#3557c5'},
  {id:'lime', name:'Lime', set:'air', hex:'#b6f25c'},
  {id:'rose', name:'Rose', set:'air', hex:'#ff8fb3'},
  {id:'emerald', name:'Emerald', set:'air', hex:'#00a86b', rare:true}
];
const SQUISHY_MAP = Object.fromEntries(SQUISHIES.map(s => [s.id, s]));
const SETS = [{id:'school', name:'School'}, {id:'park', name:'Park'}, {id:'air', name:'Airport'}];
const PLAYABLE = ['ava','darcey','axel','hallie'];
const UNIFORM = '#6D1A2A';
const TROUSERS = '#1a1a1a';
const CHARCOAL = '#5a6168';
const SHIRT = '#ffffff';
const KIDS = {
  ava: {name:'Ava', age:7, scale:1, hair:'#ffd24a', outfit:UNIFORM, shoe:TROUSERS, own:'#ff79b0', ownShoe:'#ff5a7a', style:'pony', band:'#ff5a7a', blurb:'Age 7. Blonde ponytail. Likes making plans.'},
  darcey: {name:'Darcey', age:7, scale:1, hair:'#6b3a22', outfit:UNIFORM, shoe:TROUSERS, own:'#8b6cff', ownShoe:'#3a2a6a', style:'plait', band:'#ffd24a', blurb:'Age 7. Brown plait. Fast on the swings.'},
  axel: {name:'Axel', age:4, scale:0.78, hair:'#ffe07a', outfit:UNIFORM, shorts:TROUSERS, shoe:TROUSERS, own:'#3aa0ff', ownShorts:'#2f9e55', ownShoe:'#f4f4f4', style:'buzz', blurb:'Age 4. Blond buzz cut. Biscuit expert.'},
  hallie: {name:'Hallie', age:4, scale:0.8, hair:'#6b3a22', outfit:UNIFORM, shoe:TROUSERS, own:'#ffe14a', ownShoe:'#ff7ab0', style:'pigtails', blurb:'Age 4. Brown pigtails. Friend of every duck.'},
  finn: {name:'Finn', age:7, scale:0.92, hair:'#e25822', outfit:UNIFORM, shorts:TROUSERS, shoe:TROUSERS, style:'buzz', blurb:''}
};
const PAIRS = [
  {ids:['ava','axel'], label:'Ava & Axel', coat:'#7a4a28', coatDark:'#5c3518', topHair:'#ffe07a', topStyle:'buzz', lowHair:'#ffd24a', lowStyle:'pony', little:'#f4f4f4', big:'#ff5a7a'},
  {ids:['darcey','hallie'], label:'Darcey & Hallie', coat:'#2c3d78', coatDark:'#1c2858', topHair:'#6b3a22', topStyle:'pigtails', lowHair:'#6b3a22', lowStyle:'plait', little:'#ff7ab0', big:'#3a2a6a'}
];
const SKIN = '#ffc8a8';

let state = null;
let ROOMS = {};
let mode = 'title';
let trail = [];
let dest = null;
let destId = null;
let destTimer = 0;
let hover = null;
let dialog = null;
let modalOpen = false;
let time = 0;
let cam = {x:0, y:0, scale:1};
let floats = [];
let walkPhase = 0;
let moving = false;
let busX = 1100;
let cssW = 960, cssH = 540, dpr = 1;
let miniJob = null;
let winToken = 0;
let barkTimer = 12;
let toastTimer = 0;
let lastFrame = 0;
const keys = new Set();
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function blankState(leader) {
  return {
    leader: leader || 'ava',
    level: 1,
    room: 'classroom',
    px: 480, py: 300, facing: 'down',
    items: {paper:false, pencils:false, plan:false, spades:0, biscuit:false, key:false, coatMaple:false, coatButton:false},
    squishies: {},
    stars: 0,
    flags: {},
    muted: false,
    unlocked: 1
  };
}
function countSet(set) { return SQUISHIES.filter(s => s.set === set && state.squishies[s.id]).length; }
function kidName() { return KIDS[state.leader].name; }
function buddy() {
  const id = PLAYABLE.find(k => k !== state.leader) || 'ava';

    const cx = Math.max(ex + rr, Math.min(x, ex + ew - rr));

function timingGame(opts) {
  let hits = 0, pos = 0, dir = 1, alive = true, last = performance.now();
  const bar = el('div', {class:'tbar'});
  const zone = el('div', {class:'zone'});
  const needle = el('div', {class:'needle'});
  bar.append(zone, needle);
  const status = el('p', {}, '0 / ' + opts.need + '  — tap when the stick is in the green');
  const btn = el('button', {}, opts.noun || 'Now!');
  listenDown(btn, e => {
    if (e && e.cancelable) e.preventDefault();
    if (!alive) return;
    if (pos >= 0.32 && pos <= 0.68) {
      hits++;
      sfx('ok');
      status.textContent = hits + ' / ' + opts.need;
      if (opts.onHit) opts.onHit(hits);
      if (hits >= opts.need) { alive = false; succeed(bar, opts.onWin); }
    } else {
      sfx('no');
      status.textContent = 'Miss! Still ' + hits + ' / ' + opts.need;
    }
  });
  function loop(now) {
    if (!alive) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    pos += dir * dt * 0.42;
    if (pos > 1) { pos = 1; dir = -1; }
    if (pos < 0) { pos = 0; dir = 1; }
    needle.style.left = (pos * 100) + '%';
    requestAnimationFrame(loop);
  }
  showCard(card => {
    card.append(el('h2', {}, opts.title));
    card.append(el('p', {}, opts.help));
    if (opts.extra) card.append(opts.extra);
    card.append(bar);
    card.append(status);
    card.append(btn);
    addBack(card);
  });
  const raf = requestAnimationFrame(loop);
  trackMini(() => { alive = false; cancelAnimationFrame(raf); });
}
function searchGame(opts) {
  let found = false;
  const grid = el('div', {class:'grid'});
  const status = el('p', {}, opts.help);
  opts.cells.forEach(c => {
    const b = el('button', {class:'choice'}, c.label);
    if (c.bg) b.style.background = c.bg;
    b.addEventListener('click', () => {
      if (found) return;
      if (c.target) { found = true; succeed(grid, opts.onWin); }
      else { sfx('no'); b.disabled = true; b.style.opacity = '0.35'; }
    });
    grid.append(b);
  });
  showCard(card => {
    card.append(el('h2', {}, opts.title));
    card.append(status);
    card.append(grid);
    addBack(card);
  });
}

function minePoint(p, w, h) {

    const t = p / 0.3;
    return {x: x0, y: ground - 8 + (deep - (ground - 8)) * t, face: 'down'};
  }
  if (p < 0.7) {

    return {x: x0 + (x1 - x0) * t, y: deep, face: 'right'};
  }
  const t = Math.min(1, (p - 0.7) / 0.3);
  return {x: x1, y: deep + (ground - 16 - deep) * t, face: 'up'};
}

function openCarousel() {
  const pool = [
    {id:'duck', icon:'🦆'},
    {id:'ball', icon:'⚽'},
    {id:'bear', icon:'🧸'},
    {id:'star', icon:'⭐'},
    {id:'shoe', icon:'👟'},
    {id:'apple', icon:'🍎'}
  ];
  const colors = ['#c9843a', '#2c3e6b', '#8d3b4b'];
  const need = 4;
  let hits = 0, alive = true, x = 0, speed = 180, last = performance.now();
  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  let load = shuffle(pool).slice(0, 3);
  let target = load[0];
  const stage = el('div', {class:'xray'});
  const find = el('div', {class:'xray-find'});
  const wanted = el('b', {});
  find.append('Find this', wanted);
  const status = el('p', {}, '0 / ' + need);
  const cases = load.map((item, i) => {
    const b = el('button', {class:'xray-case'});
    b.style.background = colors[i];
    const glyph = el('span', {class:'xray-item'}, '');
    b.append(glyph);
    listenDown(b, e => {
      if (e && e.cancelable) e.preventDefault();
      if (e && e.stopPropagation) e.stopPropagation();
      pick(i);
    });
    stage.append(b);
    return b;
  });
  stage.append(el('div', {class:'xray-glow'}));
  stage.append(el('div', {class:'xray-arch'}, el('span', {}, 'X-RAY')));
  function showTarget() { wanted.textContent = target.icon; }
  showTarget();
  function inWindow(btn) {
    const s = stage.getBoundingClientRect();
    const r = btn.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    return cx >= s.left + s.width * 0.30 && cx <= s.left + s.width * 0.70;
  }
  function pick(i) {
    if (!alive) return;
    if (!inWindow(cases[i])) {
      sfx('no');
      status.textContent = 'Wait until that bag is in the scanner. ' + hits + ' / ' + need;
      return;
    }
    if (load[i].id !== target.id) {
      sfx('no');
      status.textContent = 'Not that one. Look for the picture. ' + hits + ' / ' + need;
      return;
    }
    hits++;
    sfx('ok');
    if (hits >= need) {
      alive = false;
      status.textContent = 'Got it!';
      succeed(stage, () => grantSquishy('rose', 'Darcey', 'The X-ray found a rose squishy in the right suitcase!'));
      return;
    }
    const caught = target.id;
    const rest = pool.filter(p => p.id !== caught && !load.some(l => l.id === p.id));
    load[i] = rest[Math.floor(Math.random() * rest.length)];
    const choices = load.filter(l => l.id !== load[i].id);
    target = choices[Math.floor(Math.random() * choices.length)];
    showTarget();
    speed = Math.min(280, speed + 28);
    status.textContent = hits + ' / ' + need;
  }
  function loop(now) {
    if (!alive) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    x += dt * speed;
    const w = stage.clientWidth || 520;
    const span = w + 140;
    cases.forEach((b, i) => {
      b.style.left = (((i * span / 3) + x) % span - 110) + 'px';
      const scanning = inWindow(b);
      b.classList.toggle('scanning', scanning);
      b.firstChild.textContent = scanning ? load[i].icon : '';
    });
    requestAnimationFrame(loop);
  }
  showCard(card => {
    card.append(el('h2', {}, 'X-ray scanner'));
    card.append(el('p', {}, 'Bags roll through the scanner. Tap the one that shows this picture.'));
    card.append(find);
    card.append(stage);
    card.append(status);
    addBack(card);
  });
  const raf = requestAnimationFrame(loop);
  trackMini(() => { alive = false; cancelAnimationFrame(raf); });
}
function openMemory() {
  const faces = ['✈️','🌵','🌮','☀️'];
  let deck = faces.concat(faces);
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
  }
  const open = [];
  const matched = {};
  let lock = false, timer = 0, alive = true;
  const buttons = deck.map((face, i) => {
    const b = el('button', {}, '?');
    b.addEventListener('click', () => flip(i, b));
    return b;
  });
  function flip(i, b) {
    if (!alive || lock || matched[i] || open.includes(i)) return;
    open.push(i);
    b.textContent = deck[i];
    if (open.length === 2) {
      const [a, c] = open;
      if (deck[a] === deck[c]) {
        matched[a] = matched[c] = true;
        open.length = 0;
        sfx('ok');
        if (Object.keys(matched).length === deck.length) {
          alive = false;
          succeed(buttons[0].parentElement || b, () => grantSquishy('emerald', 'Hallie', 'All the pairs! The rare emerald squishy was the prize!'));
        }
      } else {
        lock = true;
        sfx('no');
        timer = setTimeout(() => {
          buttons[a].textContent = '?';
          buttons[c].textContent = '?';
          open.length = 0;
          lock = false;
        }, 700);
      }
    }
  }
  showCard(card => {
    card.append(el('h2', {}, 'Match the cards'));
    card.append(el('p', {}, 'Find the pairs. This puzzle hides the emerald squishy.'));
    const grid = el('div', {class:'mem'});
    buttons.forEach(b => grid.append(b));
    card.append(grid);
    addBack(card);
  });
  trackMini(() => { alive = false; clearTimeout(timer); });
}

function walkable(room, x, y) {
  if (x < 14 || y < 14 || x > room.w - 14 || y > room.h - 14) return false;
  return !hits(x, y, 12, room.solids);
}
function nearPoint(room, e) {
  const range = e.range || 80;
  for (let r = 0; r <= range; r += 16) {
    const steps = r === 0 ? 1 : 10;
    for (let a = 0; a < steps; a++) {
      const ang = a / steps * Math.PI * 2;
      const x = e.x + Math.cos(ang) * r;
      const y = e.y + Math.sin(ang) * r;
      if (walkable(room, x, y)) return {x, y};
    }
  }
  return null;
}
function canReach(room, x0, y0, x1, y1) {
  if (Math.hypot(x0 - x1, y0 - y1) <= 40 && walkable(room, x0, y0)) return true;
  const step = 16;
  const key = (x, y) => Math.round(x / step) + ',' + Math.round(y / step);
  const q = [[x0, y0]];
  const seen = new Set([key(x0, y0)]);
  const dirs = [[step,0],[-step,0],[0,step],[0,-step],[step,step],[step,-step],[-step,step],[-step,-step]];
  let head = 0;
  while (head < q.length && q.length < 7000) {
    const cur = q[head++];
    if (Math.hypot(cur[0] - x1, cur[1] - y1) <= 42) return true;
    for (const d of dirs) {
      const nx = cur[0] + d[0], ny = cur[1] + d[1];
      const k = key(nx, ny);
      if (seen.has(k) || !walkable(room, nx, ny)) continue;
      seen.add(k);
      q.push([nx, ny]);
    }
  }
  return false;
}
function selfTest() {
  const prev = state;
  state = blankState('ava');
  const errors = [];
  for (const [id, room] of Object.entries(ROOMS)) {
    const start = room.spawns.default;
    for (const [name, sp] of Object.entries(room.spawns)) {
      if (!walkable(room, sp.x, sp.y)) errors.push('stuck spawn ' + id + '.' + name);
    }
    for (const e of room.entities) {
      try { if (e.prompt) e.prompt(); } catch (err) { errors.push('prompt ' + id + ' ' + e.id); }
      let reached = !start;
      const range = e.range || 80;
      for (let r = 0; r <= range && !reached; r += 18) {
        const steps = r === 0 ? 1 : 8;
        for (let a = 0; a < steps && !reached; a++) {
          const ang = a / steps * Math.PI * 2;
          const x = e.x + Math.cos(ang) * r;
          const y = e.y + Math.sin(ang) * r;
          if (walkable(room, x, y) && canReach(room, start.x, start.y, x, y)) reached = true;
        }
      }
      if (!reached) errors.push('unreachable ' + id + '.' + e.id);
      if (e.to && !ROOMS[e.to]) errors.push('bad door ' + e.to);
      if (e.to && e.spawn && (!ROOMS[e.to] || !ROOMS[e.to].spawns[e.spawn])) errors.push('bad spawn ' + e.to + ' ' + e.spawn);
    }
  }
  state = prev;
  return errors;
}

function screenToWorld(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  const x = (cx - rect.left) * (cssW / Math.max(1, rect.width));
  const y = (cy - rect.top) * (cssH / Math.max(1, rect.height));
  return {x: x / cam.scale + cam.x, y: y / cam.scale + cam.y};
}
function computeHover() {
  if (mode !== 'play' || dialog || modalOpen || !state) return null;
  const room = ROOMS[state.room];
  if (!room) return null;
  let best = null, bd = 1e9, text = '';
  for (const e of room.entities) {
    const p = e.prompt && e.prompt();
    if (!p) continue;
    const d = Math.hypot(e.x - state.px, e.y - state.py);
    if (d < (e.range || 80) && d < bd) { best = e; bd = d; text = p; }
  }
  return best ? {e:best, text} : null;
}

  for (const ent of room.entities) {
    const p = ent.prompt && ent.prompt();
    if (!p) continue;
    let d = Math.hypot(ent.x - wpt.x, ent.y - wpt.y);
    if (ent.sparkle && ent.sparkle()) d = Math.min(d, Math.hypot(ent.x - wpt.x, ent.y - 46 - wpt.y));
    if (d < bd) { best = ent; bd = d; }
  }
  if (best) {
    if (Math.hypot(best.x - state.px, best.y - state.py) <= (best.range || 80)) best.use();
    else { dest = {x:best.x, y:best.y}; destId = best.id; destTimer = 3.2; }
  } else {
    dest = {x:wpt.x, y:wpt.y}; destId = null; destTimer = 3.2;

}
function axis() {
  let x = 0, y = 0;
  if (keys.has('ArrowLeft') || keys.has('a') || keys.has('A')) x -= 1;
  if (keys.has('ArrowRight') || keys.has('d') || keys.has('D')) x += 1;
  if (keys.has('ArrowUp') || keys.has('w') || keys.has('W')) y -= 1;
  if (keys.has('ArrowDown') || keys.has('s') || keys.has('S')) y += 1;
  return {x, y};
}
function tryMove(dx, dy) {
  const room = ROOMS[state.room];
  const prevX = state.px;
  const solids = room.solids;
  const free = (x, y) => !hits(x, y, 12, solids);
  if (free(state.px + dx, state.py + dy)) {
    state.px += dx;
    state.py += dy;
  } else if (free(state.px + dx, state.py)) {
    state.px += dx;
  } else if (free(state.px, state.py + dy)) {
    state.py += dy;
  } else if (dx || dy) {
    const slips = [8, -8, 14, -14];
    if (Math.abs(dx) >= Math.abs(dy)) {
      for (const n of slips) {
        if (free(state.px, state.py + n) && free(state.px + dx, state.py + n)) {
          state.py += n;
          state.px += dx;
          break;
        }
      }
    } else {
      for (const n of slips) {
        if (free(state.px + n, state.py) && free(state.px + n, state.py + dy)) {
          state.px += n;
          state.py += dy;
          break;
        }
      }
    }
  }
  if (state.room === 'security') {
    const line = 450;
    if (!state.flags.securityPassed && prevX <= line && state.px > line) state.px = line;
    if (state.flags.securityPassed && prevX >= line && state.px < line) state.px = line;
  }
}
function update(dt) {
  if (mode === 'play' && state && !dialog && !modalOpen) {
    const room = ROOMS[state.room];
    const a = axis();
    moving = false;
    if (a.x || a.y) {
      dest = null; destId = null;
      const len = Math.hypot(a.x, a.y) || 1;
      tryMove(a.x / len * 210 * dt, a.y / len * 210 * dt);
      moving = true;
      if (Math.abs(a.x) > Math.abs(a.y)) state.facing = a.x > 0 ? 'right' : 'left';
      else state.facing = a.y > 0 ? 'down' : 'up';
    } else if (dest) {
      destTimer -= dt;
      let tx = dest.x, ty = dest.y;
      if (destId) {
        const ent = room.entities.find(en => en.id === destId);
        if (ent && ent.prompt && ent.prompt() && Math.hypot(ent.x - state.px, ent.y - state.py) <= (ent.range || 80)) {
          dest = null; destId = null;
          ent.use();
        } else if (ent) { tx = ent.x; ty = ent.y; }
      }
      if (dest) {
        const ddx = tx - state.px, ddy = ty - state.py;
        const dist = Math.hypot(ddx, ddy) || 1;
        if (dist < 10 || destTimer <= 0) { dest = null; destId = null; }
        else {
          tryMove(ddx / dist * 210 * dt, ddy / dist * 210 * dt);
          moving = true;
          state.facing = Math.abs(ddx) > Math.abs(ddy) ? (ddx > 0 ? 'right' : 'left') : (ddy > 0 ? 'down' : 'up');
        }
      }
    }
    if (moving) {
      walkPhase += dt * 10;
      if (!trail.length || Math.hypot(trail[0].x - state.px, trail[0].y - state.py) >= 8) {
        trail.unshift({x:state.px, y:state.py, facing:state.facing});
        if (trail.length > 120) trail.pop();
      }
    }
    if (state.room === 'lawn' && state.flags.busArrived) busX += (500 - busX) * Math.min(1, dt * 1.4);
    barkTimer -= dt;
    if (barkTimer < 0) {
      barkTimer = 26;
      const lines = [buddy() + ': I am right behind you!', 'Axel: Are we there yet?', 'Hallie: I like the colours.', kidName() + ': Sparkles mean look closer.'];
      if (state.level === 2) lines.push('Darcey: I want a turn on the swings!');
      if (state.level === 3) lines.push('Ava: Walk tall.');
      showToast(lines[Math.floor(Math.random() * lines.length)]);
    }
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    floats[i].y -= 26 * dt;
    floats[i].life -= dt;
    if (floats[i].life <= 0) floats.splice(i, 1);
  }
  hover = computeHover();
}
function updateCamera(room) {
  const wide = room.id === 'security';
  const zoom = Math.min(cssW / (wide ? 1000 : 560), cssH / (wide ? 580 : 360));
  const fit = Math.min(cssW / room.w, cssH / room.h);
  const scale = Math.max(zoom, fit);
  const viewW = cssW / scale;
  const viewH = cssH / scale;
  let x = state.px - viewW / 2;
  let y = state.py - viewH * (state.flags.disguised ? 0.62 : 0.42);
  if (viewW >= room.w) x = (room.w - viewW) / 2;
  else x = clamp(x, 0, room.w - viewW);
  if (viewH >= room.h) y = (room.h - viewH) / 2;
  else y = clamp(y, 0, room.h - viewH);
  cam = {x, y, scale};
}
function drawRoomBg(g, room) {
  if (room.outdoor) {
    const sky = g.createLinearGradient(0, 0, 0, 170);
    sky.addColorStop(0, '#7ec8ff');
    sky.addColorStop(1, '#d9f5c8');
    g.fillStyle = sky;
    g.fillRect(0, 0, room.w, 170);
    g.fillStyle = room.floor || '#69c15f';
    g.fillRect(0, 150, room.w, room.h);
    g.fillStyle = '#ffe14a';
    g.beginPath(); g.arc(80, 48, 26, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,.9)';
    for (let i = 0; i < 3; i++) {
      const cx = ((i * 320 + time * 16) % (room.w + 140)) - 70;
      g.beginPath(); g.ellipse(cx, 36 + (i % 2) * 16, 34, 14, 0, 0, Math.PI * 2); g.fill();
    }
  } else {
    g.fillStyle = room.floor || '#f0d8b0';
    g.fillRect(0, 0, room.w, room.h);
    g.strokeStyle = 'rgba(90,60,30,.08)';
    g.lineWidth = 1;
    for (let x = 0; x < room.w; x += 48) {
      for (let y = 60; y < room.h; y += 48) g.strokeRect(x + 2, y, 44, 44);
    }
    g.fillStyle = '#fff8ee';
    g.fillRect(0, 0, room.w, 44);
    g.fillStyle = '#e2b56a';
    g.fillRect(0, 44, room.w, 8);
  }
  if (room.paint) room.paint(g);
}
function drawHedges(g, hedges) {
  const radFor = h => Math.min(h.round || 12, h.w / 2, h.h / 2);
  g.lineJoin = 'round';
  g.lineCap = 'round';
  g.lineWidth = 4;
  g.strokeStyle = '#3a2a22';
  for (const h of hedges) {
    roundRect(g, h.x, h.y, h.w, h.h, radFor(h));
    g.stroke();
  }
  g.fillStyle = '#1e6b34';
  for (const h of hedges) {
    roundRect(g, h.x, h.y, h.w, h.h, radFor(h));
    g.fill();
  }
  g.save();
  g.beginPath();
  for (const h of hedges) roundRect(g, h.x, h.y, h.w, h.h, radFor(h), true);
  g.clip();
  g.fillStyle = '#49b864';
  for (const h of hedges) {
    const inset = Math.min(h.round || 12, 10);
    if (h.w >= h.h) roundRect(g, h.x + inset, h.y + 4, Math.max(0, h.w - inset * 2), 6, 3);
    else roundRect(g, h.x + 4, h.y + inset, 6, Math.max(0, h.h - inset * 2), 3);
    g.fill();
  }
  g.restore();
}
function renderWorld(g) {
  const room = ROOMS[state.room];
  if (!room) return;
  updateCamera(room);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = room.outdoor ? '#8ecbff' : '#d9c39a';
  g.fillRect(0, 0, cssW, cssH);
  g.setTransform(dpr * cam.scale, 0, 0, dpr * cam.scale, -cam.x * cam.scale * dpr, -cam.y * cam.scale * dpr);
  g.lineJoin = 'round';
  g.lineCap = 'round';
  drawRoomBg(g, room);
  if (room.hedges) drawHedges(g, room.hedges);
  const sprites = [];
  for (const e of room.entities) {
    sprites.push({
      y: e.solid ? e.solid.y + e.solid.h : e.y,
      draw() {
        e.draw(g);
        if (e.sparkle && e.sparkle()) drawStar(g, e.x, e.y - 46, 8, '#fff4b0');
      }
    });
  }
  partySprites().forEach(p => sprites.push(p));
  sprites.sort((a, b) => a.y - b.y);
  sprites.forEach(s => s.draw(g));
  if (hover && !dialog) {
    g.strokeStyle = '#ffcf33';
    g.lineWidth = 3;
    g.beginPath();
    g.arc(hover.e.x, hover.e.y, 26 + Math.sin(time * 5) * 2, 0, Math.PI * 2);
    g.stroke();
  }
  g.font = '800 16px Trebuchet MS, sans-serif';
  g.textAlign = 'center';
  for (const f of floats) {
    g.globalAlpha = Math.max(0, Math.min(1, f.life));
    g.fillStyle = f.color;
    g.fillText(f.text, f.x, f.y);
  }
  g.globalAlpha = 1;
  if (DEBUG) {
    g.fillStyle = 'rgba(255,0,0,.25)';
    room.solids.forEach(s => g.fillRect(s.x, s.y, s.w, s.h));
  }
}
function renderAttract(g, w, h) {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#8ecbff';
  g.fillRect(0, 0, w, h);
  g.fillStyle = '#69c15f';
  g.fillRect(0, h * 0.62, w, h);
  g.fillStyle = '#ffe14a';
  g.beginPath(); g.arc(w - 70, 60, 28, 0, Math.PI * 2); g.fill();
  const sc = Math.min(1.3, w / 800);
  PLAYABLE.forEach((id, i) => {
    const x = w * (0.18 + i * 0.2);
    drawKid(g, x, h * 0.62, id, Math.sin(time * 0.4) > 0 ? 'right' : 'left', Math.sin(time * 6 + i) * 2, sc, false, false);
  });
}
function drawWaterPark(g, w, h) {
  g.fillStyle = '#7fd0ff';
  g.fillRect(0, 0, w, h);
  g.fillStyle = '#ffe14a';
  g.beginPath(); g.arc(w - 78, 58, 34, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,255,255,.92)';
  [[120, 48, 46], [250, 78, 32], [w * 0.55, 40, 40]].forEach(([x, y, r]) => {
    g.beginPath(); g.ellipse(x, y, r, r * 0.62, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(x + r * 0.7, y + 6, r * 0.72, r * 0.5, 0, 0, Math.PI * 2); g.fill();
  });
  g.fillStyle = '#8fd36a';
  g.fillRect(0, h * 0.34, w, h);
  g.fillStyle = '#f6e2bc';
  g.fillRect(0, h * 0.42, w, h);

  function palm(x, y, tall) {
    g.fillStyle = '#c9843a';
    g.fillRect(x, y, 12, tall);
    g.fillStyle = '#2f9e55';
    g.beginPath(); g.ellipse(x + 6, y + 4, 34, 12, -0.5, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(x + 6, y + 4, 34, 12, 0.5, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(x + 6, y - 2, 16, 22, 0, 0, Math.PI * 2); g.fill();
  }
  palm(28, h * 0.22, 90);
  palm(w - 52, h * 0.2, 100);

  function chute(x, y, drop, color) {
    roundRect(g, x, y, 54, drop * 0.72, 6);
    fillStroke(g, '#fff8e8');
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(x - 6, y + 10); g.lineTo(x + 27, y - 18); g.lineTo(x + 60, y + 10);
    g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = '#6b5344'; g.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
      g.beginPath();
      g.moveTo(x + 8, y + 18 + i * 16); g.lineTo(x + 46, y + 18 + i * 16); g.stroke();
    }
    g.strokeStyle = color; g.lineWidth = 18; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(x + 50, y + 24);
    g.quadraticCurveTo(x + drop * 0.85, y + 8, x + drop * 1.15, y + drop * 0.78);
    g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 4;
    g.stroke();
  }
  chute(w * 0.1, h * 0.1, h * 0.42, '#ff7a59');
  chute(w * 0.72, h * 0.12, h * 0.36, '#4aa8ff');

  const poolX = w * 0.16, poolY = h * 0.4, poolW = w * 0.68, poolH = h * 0.24;
  roundRect(g, poolX - 10, poolY - 10, poolW + 20, poolH + 20, 28);
  fillStroke(g, '#d7c4a2', 3);
  roundRect(g, poolX, poolY, poolW, poolH, 22);
  fillStroke(g, '#2f8fff', 3);
  g.fillStyle = 'rgba(255,255,255,.35)';
  g.beginPath(); g.ellipse(poolX + poolW * 0.35, poolY + poolH * 0.38, poolW * 0.22, 8, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(poolX + poolW * 0.62, poolY + poolH * 0.62, poolW * 0.16, 6, 0, 0, Math.PI * 2); g.fill();
  g.save();
  g.translate(poolX + poolW * 0.78, poolY + poolH * 0.42);
  g.fillStyle = '#ff5a7a';
  g.beginPath(); g.arc(0, 0, 16, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(0, 0, 8, 0, Math.PI * 2); g.fill();
  g.restore();

  const bedY = poolY + poolH + h * 0.08;
  PLAYABLE.forEach((id, i) => {
    const kidScale = KIDS[id].scaleY || KIDS[id].scale || 1;
    const natural = 48 + 86 * kidScale;
    const len = Math.min(natural, w * 0.22);
    const slot = w / 4;
    const x = slot * i + (slot - len) / 2;
    const y = bedY;
    const cloth = ['#ffcf33', '#ff8f6b', '#7dce6a', '#8fd3ff'][i];
    g.fillStyle = '#6b5344';
    g.fillRect(x + 16, y + 16, 7, 18);
    g.fillRect(x + len - 24, y + 16, 7, 18);
    roundRect(g, x, y - 8, len, 30, 10);
    fillStroke(g, cloth, 3);
    g.fillStyle = '#fff';
    roundRect(g, x + 6, y - 2, 22, 18, 6); g.fill();
    g.strokeStyle = '#3a2a22'; g.stroke();
    const extra = Math.max(0.42, Math.min(1, (len - 30) / (78 * kidScale)));
    g.save();
    g.translate(x + len - 34, y + 8);
    g.rotate(-Math.PI / 2);
    drawKid(g, 0, 0, id, 'down', 0, extra, false, false, true);
    g.restore();
    drawLabel(g, x + len / 2, y + 42, KIDS[id].name);
  });
}
function renderBeach(g, w, h) {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawWaterPark(g, w, h);
}
function updateHud() {
  const hud = document.getElementById('hud');
  const bar = document.getElementById('bar');
  if (!state || mode !== 'play') hud.classList.add('hidden');
  else {
    hud.classList.remove('hidden');
    document.getElementById('who').textContent = KIDS[state.leader].name + ' leads';
    document.getElementById('roompill').textContent = (ROOMS[state.room] && ROOMS[state.room].name) || '';
    const dots = set => SQUISHIES.filter(s => s.set === set).map(s =>
      '<i class="' + (state.squishies[s.id] ? 'on' : '') + '" style="background:' + s.hex + '"></i>').join('');
    document.getElementById('sc-school').innerHTML = 'School ' + countSet('school') + '/7 ' + dots('school');
    document.getElementById('sc-park').innerHTML = 'Park ' + countSet('park') + '/7 ' + dots('park');
    document.getElementById('sc-air').innerHTML = 'Airport ' + countSet('air') + '/7 ' + dots('air');
    document.getElementById('sc-star').textContent = 'Stars ' + (state.stars || 0) + '/9';
    document.getElementById('objective').textContent = objective();
  }
  bar.classList.toggle('hidden', mode !== 'play' || modalOpen);
}
function render() {
  const g = ctx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, cssW, cssH);
  if (mode === 'play') renderWorld(g);
  else if (mode === 'ending') renderBeach(g, cssW, cssH);
  else renderAttract(g, cssW, cssH);
  updateHud();
}
function fitScreen() {
  const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 0;
  if (h) document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
  resize();
}
function resize() {
  const r = document.getElementById('stage').getBoundingClientRect();
  cssW = Math.max(320, r.width || 960);
  cssH = Math.max(180, r.height || 540);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.style.width = (r.width || cssW) + 'px';
  canvas.style.height = (r.height || cssH) + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
}
function onKeyDown(e) {
  const k = e.key;
  const moveKey = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','a','A','w','W','s','S','d','D'].includes(k);
  if (moveKey) { keys.add(k); e.preventDefault(); return; }
  if (e.repeat) return;
  if (k === 'Escape') {
    if (dialog) { dialog = null; renderDialog(); }
    else if (modalOpen && mode === 'play') closeModal();
    return;
  }
  if (k === 'e' || k === 'E') { e.preventDefault(); onGo(); return; }
  if (k === ' ' || k === 'Enter') {
    if (dialog) { e.preventDefault(); advanceDialog(); return; }
    if (document.activeElement && document.activeElement.closest && document.activeElement.closest('button')) return;
    e.preventDefault();
    onGo();
    return;
  }
  if (mode !== 'play' || modalOpen) return;
  if (k === 'i' || k === 'I') openBag();
  if (k === 'g' || k === 'G') openGoals();
  if (k === 'p' || k === 'P') openPlan();
  if (k === 'm' || k === 'M') { state.muted = !state.muted; save(); }
}
function bind() {
  document.getElementById('d-next').addEventListener('click', advanceDialog);
  document.getElementById('btn-goals').addEventListener('click', () => { if (mode === 'play') openGoals(); });
  document.getElementById('btn-bag').addEventListener('click', () => { if (mode === 'play') openBag(); });
  document.getElementById('btn-plan').addEventListener('click', () => { if (mode === 'play') openPlan(); });
  document.addEventListener('touchmove', e => {
    if (e.target.closest && e.target.closest('#modal .card')) return;
    if (e.cancelable) e.preventDefault();
  }, {passive:false});
  document.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', e => keys.delete(e.key));
  window.addEventListener('blur', freezeInput);
  canvas.addEventListener('pointerup', onTap);
  canvas.addEventListener('touchend', e => {
    if (window.PointerEvent) return;
    const t = e.changedTouches && e.changedTouches[0];
    if (t) onTap(t);
  }, {passive:false});
  document.getElementById('who').addEventListener('click', () => {
    if (mode !== 'play' || !state) return;
    const names = PLAYABLE.filter(id => id !== state.leader).map(id => KIDS[id].name);
    say([{name:kidName(), text:names.join(', ') + ' are right behind me.'}]);
  });
  ['sc-school','sc-park','sc-air','sc-star'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => { if (mode === 'play') openAlbum(); });
  });
  window.addEventListener('resize', fitScreen);
  window.addEventListener('orientationchange', () => setTimeout(fitScreen, 200));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fitScreen);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('stage'));
}
function launchShot() {
  state = blankState(params.get('leader') || 'ava');
  const grant = params.get('grant') || '';
  if (grant === 'school' || grant === 'park' || grant === 'all') {
    grantSet('school');
    state.items.plan = true; state.items.coatMaple = true; state.items.coatButton = true;
    state.items.spades = 2; state.flags.teacherLocked = true; state.flags.hamsterOut = true; state.flags.planRead = true;
  }
  if (grant === 'park' || grant === 'all') { grantSet('park'); state.flags.busArrived = true; }
  if (grant === 'all') grantSet('air');
  if (params.get('plan')) state.items.plan = true;
  if (params.get('disguise')) { state.flags.disguised = true; state.items.coatMaple = true; state.items.coatButton = true; }
  if (params.get('security')) state.flags.securityPassed = true;
  const roomId = params.get('room') || 'classroom';
  const room = ROOMS[roomId] || ROOMS.classroom;
  const sp = room.spawns[params.get('spawn') || 'default'] || room.spawns.default;
  state.room = room.id;
  state.px = sp.x; state.py = sp.y;
  state.level = Number(params.get('level') || room.level || 1);
  if (params.get('tunnel')) state.flags.tunnelOpen = true;
  refreshDerived();
  resetTrail();
  mode = 'play';
  closeModal();
  if (params.get('open') === 'plan') openPlan();
  if (params.get('mini') === 'bells') openBells();
  if (params.get('mini') === 'memory') openMemory();
  if (params.get('ending')) { state.unlocked = 4; grantSet('school'); grantSet('park'); grantSet('air'); showEnding(); }
}
function frame(now) {
  try {
    const dt = Math.min(0.05, (now - lastFrame) / 1000 || 0);
    lastFrame = now;
    time += dt;
    update(dt);
    render();
  } catch (err) {
    const elErr = document.getElementById('err');
    elErr.style.display = 'block';
    elErr.textContent = 'Something went wobbly. Please refresh the page.';
    console.error(err);
    return;
  }
  requestAnimationFrame(frame);
}
function init() {
  state = blankState('ava');
  state.unlocked = unlockLevel();
  ROOMS = buildRooms();
  bind();
  fitScreen();
  if (params.has('autotest')) {
    const errors = selfTest().concat(logicTest());
    const pre = document.createElement('pre');
    pre.id = 'autotest';
    pre.textContent = errors.length ? errors.join('\n') : 'OK';
    document.body.append(pre);
  }
  window.SQ = {
    get state(){ return state; },
    rooms: () => ROOMS,
    enter, collect, selfTest, logicTest, digBlockers, begin, beginChapter
  };
  if (params.get('play') || params.get('ending')) launchShot();
  else openTitle();
  lastFrame = performance.now();
  requestAnimationFrame(frame);
}
window.addEventListener('error', e => {
  const elErr = document.getElementById('err');
  elErr.style.display = 'block';
  elErr.textContent = e.message + ' @' + e.lineno;
});
init();
</script>
