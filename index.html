<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Squishy Escape</title>
<style>
  :root { --ink:#3a2a22; --paper:#fffaf0; --yellow:#ffcf33; --sky:#8ecbff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#6eb6ee; color:var(--ink);
    font-family:"Trebuchet MS","Comic Sans MS","Chalkboard SE","Segoe UI",sans-serif; }
  body { overflow:hidden; user-select:none; }
  #app { height:100%; height:100dvh; display:flex; flex-direction:column; touch-action:none; }
  #stage { flex:1; min-height:0; position:relative; background:#8ecbff; }
  #c { display:block; width:100%; height:100%; touch-action:none; }
  .faces canvas { width:120px; height:130px; }
  .char canvas { width:140px; height:150px; }
  #fade { position:absolute; inset:0; background:#3a2a22; opacity:0; pointer-events:none; transition:opacity .18s; z-index:4; }
  #fade.on { opacity:1; }
  #hud { position:absolute; z-index:5; left:8px; right:8px; top:8px; display:flex; flex-wrap:wrap; gap:6px; pointer-events:none; }
  #hud.hidden { display:none; }
  .pill { pointer-events:auto; background:rgba(255,250,240,.94); border:3px solid var(--ink); border-radius:999px;
    padding:4px 10px; font-weight:800; color:var(--ink); font-size:14px; font-family:inherit; }
  button.pill { cursor:pointer; }
  #objective { flex:1 0 100%; border-radius:14px; text-align:center; pointer-events:none; }
  .pill i { display:inline-block; width:9px; height:9px; border-radius:50%; margin:0 1px; border:1px solid var(--ink); opacity:.28; vertical-align:middle; }
  .pill i.on { opacity:1; }
  #toast { position:absolute; z-index:6; top:78px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:8px 12px; border-radius:12px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:92%; text-align:center; font-weight:700; }
  #toast.show { opacity:1; }
  #dialog { position:absolute; z-index:7; left:10px; right:10px; bottom:10px; background:var(--paper);
    border:4px solid var(--ink); border-radius:18px; padding:10px 12px 12px; box-shadow:0 6px 0 rgba(0,0,0,.12); }
  #dialog.hidden { display:none; }
  #d-who { font-weight:900; color:#b4236a; min-height:1em; }
  #d-text { margin:4px 0 8px; font-size:18px; line-height:1.35; }
  #bar { display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:#fff6e4; border-top:4px solid var(--ink); }
  #bar.hidden { display:none; }
  .dpad { display:grid; grid-template-areas:". u ." "l . r" ". d ."; grid-template-columns:68px 68px 68px; grid-template-rows:68px 68px 68px; gap:4px; }
  .dpad [data-dir="up"]{grid-area:u} .dpad [data-dir="left"]{grid-area:l} .dpad [data-dir="right"]{grid-area:r} .dpad [data-dir="down"]{grid-area:d}
  #midbtns { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  button { font-family:inherit; font-weight:800; color:var(--ink); border:3px solid var(--ink); background:#fff; border-radius:16px; cursor:pointer; }
  button:active { filter:brightness(.92); }
  button:focus-visible { outline:4px solid #3a8bff; outline-offset:2px; }
  .dpad button, #midbtns button { width:68px; height:68px; font-size:22px; padding:0; }
  #midbtns button { font-size:13px; line-height:1.1; }
  #go { width:104px; height:104px; border-radius:50%; background:var(--yellow); font-size:18px; line-height:1.1; padding:8px;
    box-shadow:0 4px 0 #c49212; }
  #go.dim { opacity:.5; }
  #modal { position:fixed; inset:0; z-index:30; background:rgba(24,40,70,.4); display:flex; align-items:center; justify-content:center; padding:12px; }
  #modal.hidden { display:none; }
  .card { background:var(--paper); border:4px solid var(--ink); border-radius:24px; max-width:920px; width:min(920px,100%);
    max-height:min(92dvh,920px); overflow:auto; padding:16px 16px 20px; touch-action:pan-y; box-shadow:0 10px 0 rgba(0,0,0,.15); }
  .card h1, .card h2 { margin:4px 0 8px; text-align:center; }
  .card p { font-size:18px; line-height:1.4; margin:8px 0; }
  .card .row { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:12px 0; }
  .faces { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .char { width:150px; background:#fff; border:3px solid var(--ink); border-radius:18px; padding:6px; text-align:center; }
  .char h3 { margin:0; }
  .char p { font-size:13px; margin:4px 0; }
  .char canvas { width:140px; height:150px; }
  .card > button, .card .primary { background:var(--yellow); min-height:52px; padding:8px 16px; font-size:18px; margin:6px; }
  .ghost { background:#fff !important; }
  .choices, .grid { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:10px 0; }
  .choice { min-width:84px; min-height:84px; font-size:28px; padding:8px; }
  .choice.lit { transform:scale(1.08); box-shadow:0 0 0 4px #fff, 0 0 0 8px var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(4, minmax(64px,1fr)); }
  .tbar { position:relative; height:36px; border-radius:20px; background:#efe6d6; border:3px solid var(--ink); overflow:hidden; margin:16px 8px; }
  .zone { position:absolute; left:32%; width:36%; top:0; bottom:0; background:#9be59a; }
  .needle { position:absolute; top:0; width:8px; height:100%; background:var(--ink); border-radius:4px; }
  .bigwin { font-size:42px; text-align:center; margin:8px; }
  .goals { list-style:none; padding:0; margin:0; }
  .goals li { padding:8px 10px; border-radius:12px; margin:6px 0; background:#fff; border:3px solid #eadfce; font-weight:700; }
  .goals li.done { background:#e5f8df; }
  .pips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .pip { width:78px; height:78px; border-radius:50%; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:12px; font-weight:800; border:3px solid var(--ink); background:#e6e0d6; color:#fff; }
  .pip.got { background:var(--c); color:#3a2a22; }
  .pip.rare { box-shadow:0 0 0 4px gold; }
  .slots { display:flex; gap:8px; justify-content:center; margin:8px 0; }
  .slot, .sample span { width:64px; height:64px; border:3px dashed var(--ink); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:32px; background:#fff; }
  .skybox, .pondbox, .pit { position:relative; height:180px; overflow:hidden; border:3px solid var(--ink); border-radius:16px; background:#b9e6ff; margin:8px 0; }
  .pondbox { background:#7ec8ea; }
  .pit { background:#f0d59a; height:220px; }
  .mover { position:absolute; font-size:42px; }
  .mem { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .mem button { min-height:78px; font-size:34px; }
  .swingbox { height:200px; position:relative; border-bottom:4px solid var(--ink); }
  .rope { position:absolute; left:50%; top:0; width:4px; height:120px; background:var(--ink); transform-origin:top center; }
  .seat { position:absolute; left:-18px; top:110px; font-size:40px; }
  #err { display:none; position:fixed; z-index:80; left:0; right:0; bottom:0; background:#ffd6d6; color:#600; padding:8px; white-space:pre-wrap; font-size:12px; }
  #autotest { position:fixed; z-index:70; left:8px; bottom:8px; background:#fff; padding:8px; max-width:90vw; }
  .plan { width:100%; height:auto; background:#fff8e6; border:3px solid var(--ink); border-radius:12px; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .shake { animation:shake .28s; }
  @media (min-width:721px) { #midbtns .ico { display:none; } }
  @media (max-width:720px) {
    .dpad { grid-template-columns:52px 52px 52px; grid-template-rows:52px 52px 52px; }
    .dpad button, #midbtns button { width:52px; height:52px; font-size:16px; }
    #midbtns .lbl { display:none; }
    #go { width:84px; height:84px; font-size:16px; }
    #d-text { font-size:16px; }
    .char { width:46%; }
  }
  @media (max-height:520px) {
    .dpad { grid-template-columns:48px 48px 48px; grid-template-rows:48px 48px 48px; }
    .dpad button, #midbtns button { width:48px; height:48px; }
    #go { width:72px; height:72px; }
    #hud { top:4px; }
    .pill { font-size:12px; padding:2px 8px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" width="960" height="540"></canvas>
    <div id="fade"></div>
    <div id="hud">
      <button type="button" id="who" class="pill">Friends</button>
      <span id="roompill" class="pill">Room</span>
      <button type="button" id="sc-school" class="pill">School</button>
      <button type="button" id="sc-park" class="pill">Park</button>
      <button type="button" id="sc-air" class="pill">Airport</button>
      <button type="button" id="sc-star" class="pill">Stars</button>
      <div id="objective" class="pill">Let's go</div>
    </div>
    <div id="toast"></div>
    <div id="dialog" class="hidden">
      <div id="d-who"></div>
      <p id="d-text"></p>
      <button type="button" id="d-next">Next</button>
    </div>
  </div>
  <div id="bar">
    <div class="dpad" id="dpad">
      <button type="button" data-dir="up" aria-label="Up">▲</button>
      <button type="button" data-dir="left" aria-label="Left">◀</button>
      <button type="button" data-dir="right" aria-label="Right">▶</button>
      <button type="button" data-dir="down" aria-label="Down">▼</button>
    </div>
    <div id="midbtns">
      <button type="button" id="btn-goals" aria-label="Goals"><span class="lbl">Goals</span><span class="ico">★</span></button>
      <button type="button" id="btn-bag" aria-label="Bag"><span class="lbl">Bag</span><span class="ico">🎒</span></button>
      <button type="button" id="btn-plan" aria-label="Plan"><span class="lbl">Plan</span><span class="ico">🗺️</span></button>
      <button type="button" id="btn-mute" aria-label="Sound">On</button>
    </div>
    <button type="button" id="go" aria-label="Do the action">Look</button>
  </div>
</div>
<div id="modal" class="hidden"></div>
<div id="err"></div>
<script>
'use strict';
const SAVE = 'squishy-escape-v1';
const UNLOCK = 'squishy-escape-unlock-v1';
const params = new URLSearchParams(location.search);
const DEBUG = params.has('debug');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const SQUISHIES = [
  {id:'pink', name:'Pink', set:'school', hex:'#ff6fae'},
  {id:'blue', name:'Blue', set:'school', hex:'#4aa8ff'},
  {id:'purple', name:'Purple', set:'school', hex:'#b06bff'},
  {id:'yellow', name:'Yellow', set:'school', hex:'#ffd23f'},
  {id:'orange', name:'Orange', set:'school', hex:'#ff8a2a'},
  {id:'red', name:'Red', set:'school', hex:'#ff4d4d'},
  {id:'gold', name:'Gold', set:'school', hex:'#ffc107', rare:true},
  {id:'mint', name:'Mint', set:'park', hex:'#7dffa8'},
  {id:'lavender', name:'Lavender', set:'park', hex:'#c9b6ff'},
  {id:'coral', name:'Coral', set:'park', hex:'#ff7f6e'},
  {id:'sky', name:'Sky', set:'park', hex:'#8fd3ff'},
  {id:'lemon', name:'Lemon', set:'park', hex:'#fff06a'},
  {id:'lilac', name:'Lilac', set:'park', hex:'#e7a6ff'},
  {id:'rainbow', name:'Rainbow', set:'park', hex:'#ff7ad9', rare:true, rainbow:true},
  {id:'teal', name:'Teal', set:'air', hex:'#2ec4b6'},
  {id:'magenta', name:'Magenta', set:'air', hex:'#ff4fa3'},
  {id:'peach', name:'Peach', set:'air', hex:'#ffc2a1'},
  {id:'navy', name:'Navy', set:'air', hex:'#3557c5'},
  {id:'lime', name:'Lime', set:'air', hex:'#b6f25c'},
  {id:'rose', name:'Rose', set:'air', hex:'#ff8fb3'},
  {id:'emerald', name:'Emerald', set:'air', hex:'#00a86b', rare:true}
];
const SQUISHY_MAP = Object.fromEntries(SQUISHIES.map(s => [s.id, s]));
const SETS = [{id:'school', name:'School'}, {id:'park', name:'Park'}, {id:'air', name:'Airport'}];
const PLAYABLE = ['ava','darcey','axel','hallie'];
const KIDS = {
  ava: {name:'Ava', age:7, scale:1, hair:'#ffd24a', outfit:'#ff79b0', shoe:'#ff5a7a', style:'pony', band:'#ff5a7a', blurb:'Age 7. Blonde ponytail. Likes making plans.'},
  darcey: {name:'Darcey', age:7, scale:1.16, hair:'#6b3a22', outfit:'#8b6cff', shoe:'#3a2a6a', style:'pony', band:'#ffd24a', blurb:'Age 7. Taller. Brown ponytail. Fast on the swings.'},
  axel: {name:'Axel', age:4, scale:0.78, hair:'#ffe07a', outfit:'#3aa0ff', shorts:'#2f9e55', shoe:'#f4f4f4', style:'buzz', blurb:'Age 4. Blond buzz cut. Biscuit expert.'},
  hallie: {name:'Hallie', age:4, scale:0.8, hair:'#6b3a22', outfit:'#ffe14a', shoe:'#ff7ab0', style:'pigtails', blurb:'Age 4. Brown pigtails. Friend of every duck.'},
  finn: {name:'Finn', age:7, scale:0.92, hair:'#e25822', outfit:'#3ecf6e', shorts:'#245c9a', shoe:'#333', style:'buzz', blurb:''}
};
const PAIRS = [
  {ids:['ava','axel'], label:'Ava & Axel', coat:'#7a4a28', coatDark:'#5c3518', hair:'#ffd24a', littleHair:'#ffe07a', little:'#f4f4f4', big:'#ff5a7a'},
  {ids:['darcey','hallie'], label:'Darcey & Hallie', coat:'#2c3d78', coatDark:'#1c2858', hair:'#6b3a22', littleHair:'#6b3a22', little:'#ff7ab0', big:'#3a2a6a'}
];
const SKIN = '#ffc8a8';

let state = null;
let ROOMS = {};
let mode = 'title';
let trail = [];
let dest = null;
let destId = null;
let destTimer = 0;
let hover = null;
let dialog = null;
let modalOpen = false;
let time = 0;
let cam = {x:0, y:0, scale:1};
let floats = [];
let walkPhase = 0;
let moving = false;
let busX = 1100;
let cssW = 960, cssH = 540, dpr = 1;
let miniJob = null;
let winToken = 0;
let barkTimer = 12;
let toastTimer = 0;
let lastFrame = 0;
const keys = new Set();
const held = {up:false, down:false, left:false, right:false};
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function blankState(leader) {
  return {
    leader: leader || 'ava',
    level: 1,
    room: 'classroom',
    px: 480, py: 300, facing: 'down',
    items: {paper:false, pencils:false, plan:false, spades:0, biscuit:false, key:false, coatMaple:false, coatButton:false},
    squishies: {},
    stars: 0,
    flags: {},
    muted: false,
    unlocked: 1
  };
}
function countSet(set) { return SQUISHIES.filter(s => s.set === set && state.squishies[s.id]).length; }
function kidName() { return KIDS[state.leader].name; }
function buddy() {
  const id = PLAYABLE.find(k => k !== state.leader) || 'ava';
  return KIDS[id].name;
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function save() {
  try {
    const data = {
      leader: state.leader, level: state.level, room: state.room, px: state.px, py: state.py, facing: state.facing,
      items: state.items, squishies: state.squishies, stars: state.stars || 0, flags: state.flags,
      muted: !!state.muted, unlocked: state.unlocked || 1
    };
    localStorage.setItem(SAVE, JSON.stringify(data));
    localStorage.setItem(UNLOCK, String(state.unlocked || 1));
  } catch (e) { /* private mode */ }
}
function unlockLevel() { return Number(localStorage.getItem(UNLOCK) || '1') || 1; }
function loadState() {
  try {
    const raw = localStorage.getItem(SAVE);
    if (!raw) return null;
    const data = JSON.parse(raw);
    const s = blankState(data.leader || 'ava');
    s.level = data.level || 1;
    s.room = data.room || 'classroom';
    s.px = data.px ?? 480; s.py = data.py ?? 300; s.facing = data.facing || 'down';
    Object.assign(s.items, data.items || {});
    s.squishies = data.squishies || {};
    s.stars = data.stars || 0;
    s.flags = data.flags || {};
    s.muted = !!data.muted;
    s.unlocked = Math.max(data.unlocked || 1, unlockLevel());
    if (!ROOMS[s.room]) s.room = 'classroom';
    return s;
  } catch (e) { return null; }
}
function refreshDerived() {
  if (countSet('park') >= 7) state.flags.busArrived = true;
}
function grantSet(set) { SQUISHIES.forEach(s => { if (s.set === set) state.squishies[s.id] = true; }); }

let actx = null;
function ac() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, when, gain) {
  if (!state || state.muted) return;
  try {
    const a = ac();
    const o = a.createOscillator();
    const g = a.createGain();
    const t0 = a.currentTime + (when || 0);
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(gain || 0.07, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) { /* audio optional */ }
}
function sfx(name) {
  if (name === 'collect') { tone(523,.12,'triangle',0,.08); tone(659,.12,'triangle',.1,.08); tone(784,.18,'triangle',.2,.08); }
  else if (name === 'star') { tone(880,.1,'sine',0,.06); tone(1174,.16,'sine',.1,.06); }
  else if (name === 'no') tone(196,.14,'square',0,.03);
  else if (name === 'ok') tone(660,.09,'sine',0,.06);
  else if (name === 'dig') tone(130,.07,'triangle',0,.05);
  else if (name === 'bus') { tone(196,.18,'sawtooth',0,.03); tone(262,.28,'sawtooth',.12,.03); }
}

function el(tag, attrs, child) {
  const n = document.createElement(tag);
  attrs = attrs || {};
  for (const k of Object.keys(attrs)) {
    if (k === 'class') n.className = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  if (tag === 'button' && !n.getAttribute('type')) n.type = 'button';
  if (child != null) {
    if (Array.isArray(child)) child.forEach(c => n.append(c));
    else n.append(child);
  }
  return n;
}
function freezeInput() {
  keys.clear();
  held.up = held.down = held.left = held.right = false;
  dest = null; destId = null;
}
function trackMini(stop) {
  if (miniJob) miniJob();
  miniJob = stop;
}
function cleanupMini() {
  winToken++;
  if (miniJob) { const s = miniJob; miniJob = null; s(); }
}
function showCard(build) {
  cleanupMini();
  freezeInput();
  modalOpen = true;
  const modal = document.getElementById('modal');
  modal.classList.remove('hidden');
  modal.replaceChildren();
  const card = el('div', {class:'card'});
  modal.append(card);
  build(card);
}
function closeModal() {
  cleanupMini();
  modalOpen = false;
  const modal = document.getElementById('modal');
  modal.classList.add('hidden');
  modal.replaceChildren();
}
function addBack(card, label) {
  const b = el('button', {class:'ghost'}, label || 'Back');
  b.addEventListener('click', closeModal);
  card.append(b);
}
function succeed(node, onWin) {
  const token = ++winToken;
  sfx('ok');
  node.append(el('p', {class:'bigwin'}, 'Yes!'));
  setTimeout(() => { if (token === winToken) onWin(); }, 480);
}

function say(lines, onDone) {
  freezeInput();
  dialog = {lines, i:0, onDone: onDone || null};
  renderDialog();
}
function renderDialog() {
  const d = document.getElementById('dialog');
  if (!dialog) { d.classList.add('hidden'); return; }
  d.classList.remove('hidden');
  document.getElementById('d-who').textContent = dialog.lines[dialog.i].name || '';
  document.getElementById('d-text').textContent = dialog.lines[dialog.i].text;
}
function advanceDialog() {
  if (!dialog) return;
  dialog.i++;
  if (dialog.i >= dialog.lines.length) {
    const cb = dialog.onDone;
    dialog = null;
    renderDialog();
    if (cb) cb();
  } else renderDialog();
}
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function floatText(text, x, y, color) {
  floats.push({text, x, y, life:1.35, color: color || '#3a2a22'});
}

function roundRect(g, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function fillStroke(g, fill, lw) {
  g.fillStyle = fill;
  g.fill();
  g.lineWidth = lw || 2;
  g.strokeStyle = '#3a2a22';
  g.stroke();
}
function drawLabel(g, x, y, text) {
  g.font = '700 13px Trebuchet MS, Comic Sans MS, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineWidth = 3;
  g.strokeStyle = 'rgba(255,255,255,.92)';
  g.strokeText(text, x, y);
  g.fillStyle = '#3a2a22';
  g.fillText(text, x, y);
}
function drawStar(g, x, y, r, color) {
  g.save();
  g.translate(x, y);

function hits(x, y, r, rects) {

    const cx = Math.max(s.x, Math.min(x, s.x + s.w));
    const cy = Math.max(s.y, Math.min(y, s.y + s.h));
    const dx = x - cx, dy = y - cy;
    if (dx * dx + dy * dy < r * r) return true;
  }
  return false;

    if (!state.flags.tunnelOpen) return 'Dig a tunnel in the playground sandpit';
    return 'Crawl through the tunnel!';
  }
  if (state.level === 2) {
    if (countSet('park') < 7) return 'Play on the rides and collect 7 park squishies (' + countSet('park') + '/7)';
    return 'Board the bus. The front sign says AIRPORT.';
  }
  if (!state.flags.securityPassed) {
    if (!state.flags.disguised) {
      if (!state.squishies.teal || !state.squishies.rose) return 'Check-in, baggage belt, then the photo booth coats';
      return 'Photo booth: little ones on shoulders, then the coats';
    }
    return 'Walk through security in the tall coats';
  }
  if (countSet('air') < 7) return 'Collect all 7 airport squishies (' + countSet('air') + '/7)';
  return 'The MEXICO sign is flashing. Board the plane!';
}
function goalList() {
  const done = (t, ok) => ({text:t, done:!!ok});
  if (state.level === 1) {
    return [
      done('Paper', state.items.paper || state.items.plan),
      done('Pencils', state.items.pencils || state.items.plan),
      done('Plan drawn on the table', state.items.plan),
      done("Miss Button's coat", state.items.coatButton),
      done("Ms Maple's coat", state.items.coatMaple),
      done('Shed key', state.items.key),
      done('Two spades', (state.items.spades || 0) >= 2),
      done('Biscuit', state.items.biscuit || state.flags.teacherLocked),
      done('Ms Maple is counting in the cupboard', state.flags.teacherLocked),
      done('School squishies ' + countSet('school') + '/7', countSet('school') >= 7),
      done('Tunnel', state.flags.tunnelOpen || state.level > 1)
    ];
  }
  if (state.level === 2) {
    const rows = SQUISHIES.filter(s => s.set === 'park').map(s => done(s.name + (s.rare ? ' (rare)' : ''), state.squishies[s.id]));
    rows.push(done('Airport bus', state.level > 2));
    return rows;
  }
  const rows = [
    done('Tall-coat disguise', state.flags.disguised),
    done('Through security', state.flags.securityPassed)
  ];
  SQUISHIES.filter(s => s.set === 'air').forEach(s => rows.push(done(s.name + (s.rare ? ' (rare)' : ''), state.squishies[s.id])));
  rows.push(done('Plane to Mexico', state.unlocked >= 4 && state.level > 3));
  return rows;
}

function resetTrail() {
  const knots = [{x:0, y:0}, {x:-120, y:96}, {x:110, y:96}, {x:200, y:150}];
  trail = [];
  for (let i = 0; i <= 20; i++) {
    const t = i / 5;
    const a = Math.min(knots.length - 1, Math.floor(t));
    const f = t - a;
    const p0 = knots[a];
    const p1 = knots[Math.min(knots.length - 1, a + 1)];
    trail.push({
      x: state.px + p0.x + (p1.x - p0.x) * f,
      y: state.py + p0.y + (p1.y - p0.y) * f,
      facing: 'down'
    });
  }
}
function trailPoint(i) {
  if (!trail.length) return {x: state.px, y: state.py, facing: state.facing};
  const idx = Math.min(trail.length - 1, (i + 1) * 5);
  return trail[idx];
}

function orderGame(opts) {
  let round = 0, step = 0, locked = false;
  const status = el('p', {class:'status'}, opts.show ? 'Watch...' : 'Your turn');
  const row = el('div', {class:'choices'});
  const btns = {};
  let timer = 0;
  opts.buttons.forEach(b => {
    const n = el('button', {class:'choice'}, b.label);
    n.style.background = b.bg || '#fff';
    n.addEventListener('click', () => press(b.id, n));
    btns[b.id] = n;
    row.append(n);
  });
  function press(id, node) {
    if (locked) return;
    const seq = opts.rounds[round];
    const spec = opts.buttons.find(b => b.id === id);
    if (spec && spec.freq) tone(spec.freq, .12, 'triangle');
    if (id !== seq[step]) {
      sfx('no');
      node.classList.add('shake');
      setTimeout(() => node.classList.remove('shake'), 280);
      step = 0;
      status.textContent = 'Not quite. Try again!';
      if (opts.show) playShow();
      return;
    }
    step++;
    status.textContent = step + ' / ' + seq.length;
    if (step >= seq.length) {
      round++;
      step = 0;
      if (round >= opts.rounds.length) {
        locked = true;
        succeed(row, opts.onWin);
      } else if (opts.show) {
        status.textContent = 'Next one!';
        playShow();
      } else status.textContent = 'Next!';
    }
  }
  function playShow() {
    locked = true;
    const seq = opts.rounds[round];
    let i = 0;
    clearInterval(timer);
    timer = setInterval(() => {
      Object.values(btns).forEach(b => b.classList.remove('lit'));
      if (i >= seq.length) {
        clearInterval(timer);
        locked = false;
        status.textContent = 'Your turn!';
        return;
      }
      const id = seq[i];
      btns[id].classList.add('lit');
      const spec = opts.buttons.find(b => b.id === id);
      if (spec && spec.freq) tone(spec.freq, .12, 'triangle');
      i++;
    }, 680);
  }
  showCard(card => {
    card.classList.add('wide');
    card.append(el('h2', {}, opts.title));
    card.append(el('p', {}, opts.help));
    card.append(row);
    card.append(status);
    addBack(card);
  });
  trackMini(() => clearInterval(timer));
  if (opts.show) playShow();
}
function timingGame(opts) {
  let hits = 0, pos = 0, dir = 1, alive = true, last = performance.now();
  const bar = el('div', {class:'tbar'});
  const zone = el('div', {class:'zone'});
  const needle = el('div', {class:'needle'});
  bar.append(zone, needle);
  const status = el('p', {}, '0 / ' + opts.need + '  — tap when the stick is in the green');
  const btn = el('button', {}, opts.noun || 'Now!');
  btn.addEventListener('click', () => {
    if (!alive) return;
    if (pos >= 0.32 && pos <= 0.68) {
      hits++;
      sfx('ok');
      status.textContent = hits + ' / ' + opts.need;
      if (opts.onHit) opts.onHit(hits);
      if (hits >= opts.need) { alive = false; succeed(bar, opts.onWin); }
    } else {
      sfx('no');
      status.textContent = 'Miss! Still ' + hits + ' / ' + opts.need;
    }
  });
  function loop(now) {
    if (!alive) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    pos += dir * dt * 0.42;
    if (pos > 1) { pos = 1; dir = -1; }
    if (pos < 0) { pos = 0; dir = 1; }
    needle.style.left = (pos * 100) + '%';
    requestAnimationFrame(loop);
  }
  showCard(card => {
    card.append(el('h2', {}, opts.title));
    card.append(el('p', {}, opts.help));
    if (opts.extra) card.append(opts.extra);
    card.append(bar);
    card.append(status);
    card.append(btn);
    addBack(card);
  });
  const raf = requestAnimationFrame(loop);
  trackMini(() => { alive = false; cancelAnimationFrame(raf); });
}
function searchGame(opts) {
  let found = false;
  const grid = el('div', {class:'grid'});
  const status = el('p', {}, opts.help);
  opts.cells.forEach(c => {
    const b = el('button', {class:'choice'}, c.label);
    if (c.bg) b.style.background = c.bg;
    b.addEventListener('click', () => {
      if (found) return;
      if (c.target) { found = true; succeed(grid, opts.onWin); }
      else { sfx('no'); b.disabled = true; b.style.opacity = '0.35'; }
    });
    grid.append(b);
  });
  showCard(card => {
    card.append(el('h2', {}, opts.title));
    card.append(status);
    card.append(grid);
    addBack(card);
  });
}

function openPaint() {
  const map = {r:'#ff5a5a', y:'#ffe14a', b:'#4aa8ff', w:'#ffffff'};
  const rounds = [['r','y','b','w'], ['y','b','r','y']];
  let round = 0, selected = 'r', grid = [null, null, null, null], showing = true;
  const cells = [0, 1, 2, 3].map(() => el('button', {class:'choice'}, ''));
  const status = el('p', {}, 'Remember this picture...');
  function paintCells() {
    cells.forEach((c, i) => {
      const id = showing ? rounds[round][i] : grid[i];
      c.style.background = id ? map[id] : '#ddd';
      c.textContent = '';
    });
  }
  function check() {
    if (grid.some(v => !v)) return;
    if (grid.every((v, i) => v === rounds[round][i])) {
      round++;
      if (round >= rounds.length) { succeed(status, () => grantSquishy('red', 'Miss Dot', 'The painting wiggles and a red squishy pops out!')); return; }
      grid = [null, null, null, null];
      showing = true;
      status.textContent = 'Yes! Remember the next one...';
      paintCells();
      setTimeout(() => { showing = false; status.textContent = 'Now paint it.'; paintCells(); }, 1400);
    } else {
      sfx('no');
      status.textContent = 'Not quite. Look again.';
      showing = true;
      grid = [null, null, null, null];
      paintCells();
      setTimeout(() => { showing = false; status.textContent = 'Try the painting.'; paintCells(); }, 1400);
    }
  }
  showCard(card => {
    card.append(el('h2', {}, 'Copy the painting'));
    card.append(el('p', {}, 'Look at the four colours, then paint the same picture.'));
    const g = el('div', {class:'grid'});
    cells.forEach((c, i) => {
      c.addEventListener('click', () => {
        if (showing) return;
        grid[i] = selected;
        paintCells();
        check();
      });
      g.append(c);
    });
    card.append(g);
    const pal = el('div', {class:'choices'});
    Object.keys(map).forEach(id => {
      const b = el('button', {class:'choice'}, id === 'w' ? 'White' : '');
      b.style.background = map[id];
      b.addEventListener('click', () => { selected = id; });
      pal.append(b);
    });
    card.append(status);
    card.append(pal);
    addBack(card);
    paintCells();
    setTimeout(() => { showing = false; status.textContent = 'Now paint it. Pick a colour, then tap a square.'; paintCells(); }, 1500);
  });
}

function openRoundabout() {
  let meter = 0, spin = false, alive = true, last = performance.now(), angle = 0;
  const wheel = el('div', {class:'swingbox'});
  wheel.textContent = '⭕';
  wheel.style.fontSize = '80px';
  wheel.style.textAlign = 'center';
  const status = el('p', {}, 'Hold Spin');
  const btn = el('button', {}, 'Spin');
  const down = () => { spin = true; };
  const up = () => { spin = false; };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); down(); });
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointerleave', up);
  function loop(now) {
    if (!alive) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (spin) { meter += dt; angle += dt * 240; sfxTick = (sfxTick || 0) + dt; }
    else meter = Math.max(0, meter - dt * 0.25);
    wheel.style.transform = 'rotate(' + angle + 'deg)';
    status.textContent = 'Spinning ' + Math.min(100, Math.floor(meter / 1.6 * 100)) + '%';
    if (meter >= 1.6) { alive = false; succeed(wheel, () => grantSquishy('sky', 'Hallie', 'The sky squishy flew off and I caught it!')); return; }
    requestAnimationFrame(loop);
  }
  let sfxTick = 0;
  showCard(card => {
    card.append(el('h2', {}, 'Roundabout'));
    card.append(el('p', {}, 'Press and hold Spin until it is fast.'));
    card.append(wheel); card.append(status); card.append(btn); addBack(card);
  });
  const raf = requestAnimationFrame(loop);
  trackMini(() => { alive = false; cancelAnimationFrame(raf); });
}

function openDucks() {
  let hits = 0, alive = true, last = performance.now(), t = 0;
  const box = el('div', {class:'pondbox'});
  const ring = el('div', {});
  ring.style.cssText = 'position:absolute;left:50%;top:70px;width:70px;height:70px;margin-left:-35px;border:4px solid #fff;border-radius:50%;';
  const duck = el('div', {class:'mover'}, '🦆');
  box.append(ring, duck);
  const status = el('p', {}, 'Tap the pond when the duck is in the white ring. 0 / 3');
  box.addEventListener('pointerdown', () => {
    const br = box.getBoundingClientRect();
    const dr = duck.getBoundingClientRect();
    const cx = br.left + br.width / 2, cy = br.top + 70 + 35;
    const dx = dr.left + dr.width / 2, dy = dr.top + dr.height / 2;
    if (Math.hypot(dx - cx, dy - cy) < 48) {
      hits++;
      sfx('ok');
      status.textContent = hits + ' / 3';
      if (hits >= 3) { alive = false; succeed(box, () => grantSquishy('lavender', 'Hallie', 'The duck brought a lavender squishy!')); }
    } else status.textContent = 'Quack! Wait for the ring. ' + hits + ' / 3';
  });
  function loop(now) {
    if (!alive) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; t += dt;
    const w = box.clientWidth || 300;
    duck.style.left = (20 + (w - 80) * (0.5 + 0.5 * Math.sin(t * 1.6))) + 'px';
    duck.style.top = '78px';
    requestAnimationFrame(loop);
  }
  showCard(card => {
    card.append(el('h2', {}, 'Feed the ducks'));
    card.append(el('p', {}, 'Tap when the duck swims through the ring.'));
    card.append(box); card.append(status); addBack(card);
  });
  const raf = requestAnimationFrame(loop);
  trackMini(() => { alive = false; cancelAnimationFrame(raf); });
}

function openPassport() {
  const order = ['😊','⭐','🧳','💖'];
  const choices = ['😊','⭐','🧳','💖','🎈','🐱'];
  let placed = [];
  const slots = order.map(() => el('div', {class:'slot'}, ''));

  order.forEach(s => sample.append(el('span', {}, s)));
  const status = el('p', {}, 'Tap the stickers in the same order as the little picture.');
  function refresh() { slots.forEach((s, i) => { s.textContent = placed[i] || ''; }); }
  showCard(card => {
    card.append(el('h2', {}, 'Make a pass'));
    card.append(el('p', {}, 'Copy the picture.'));

    const row = el('div', {class:'slots'});

    const buttons = el('div', {class:'choices'});
    choices.forEach(st => {
      const b = el('button', {class:'choice'}, st);

        refresh();
        if (placed.length === 4) succeed(row, () => grantSquishy('teal', 'Agent', 'Your pass is perfect. Here is a teal squishy!'));
      });
      buttons.append(b);
    });
    card.append(status); card.append(buttons); addBack(card);

function openMemory() {
  const faces = ['✈️','🌵','🌮','☀️'];
  let deck = faces.concat(faces);
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
  }
  const open = [];
  const matched = {};
  let lock = false, timer = 0, alive = true;
  const buttons = deck.map((face, i) => {
    const b = el('button', {}, '?');
    b.addEventListener('click', () => flip(i, b));
    return b;
  });
  function flip(i, b) {
    if (!alive || lock || matched[i] || open.includes(i)) return;
    open.push(i);
    b.textContent = deck[i];
    if (open.length === 2) {
      const [a, c] = open;
      if (deck[a] === deck[c]) {
        matched[a] = matched[c] = true;
        open.length = 0;
        sfx('ok');
        if (Object.keys(matched).length === deck.length) {
          alive = false;
          succeed(buttons[0].parentElement || b, () => grantSquishy('emerald', 'Hallie', 'All the pairs! The rare emerald squishy was the prize!'));
        }
      } else {
        lock = true;
        sfx('no');
        timer = setTimeout(() => {
          buttons[a].textContent = '?';
          buttons[c].textContent = '?';
          open.length = 0;
          lock = false;
        }, 700);
      }
    }
  }
  showCard(card => {
    card.append(el('h2', {}, 'Match the cards'));
    card.append(el('p', {}, 'Find the pairs. This puzzle hides the emerald squishy.'));
    const grid = el('div', {class:'mem'});
    buttons.forEach(b => grid.append(b));
    card.append(grid);
    addBack(card);
  });
  trackMini(() => { alive = false; clearTimeout(timer); });
}

        closeModal();
        say([{name:'Ava', text:'Nice tune! A star sticker slid out of the piano.'}]);
      }
    });
    row.append(b);
  });
  showCard(card => {
    card.append(el('h2', {}, 'Piano'));
    card.append(el('p', {}, 'Play any five notes.'));
    card.append(row);
    addBack(card);
  });
}
function trySand() {
  if (state.flags.tunnelOpen) { finishLevel(); return; }
  const need = digBlockers();
  if (need.length) {
    say([{name:buddy(), text:'The sand is not ready. We still need ' + need.join(', ') + '.'}]);
    return;
  }
  openDig();
}
function trySecurity() {
  if (state.flags.securityPassed) { enter('concourse', 'security'); return; }
  if (!state.flags.disguised) {
    say([{name:'Guard', text:'Hello! This arch is for grown-ups. I can see small knees. The photo booth and the big coats might help.'}]);
    return;
  }
  state.flags.securityPassed = true;
  save();
  sfx('ok');
  say([
    {name:'Guard', text:'Good afternoon. What tall coats. Please step through. Have a lovely flight.'},
    {name:'Hallie', text:'Hee hee. It worked!'}
  ], () => enter('concourse', 'security'));
}
function tryBoard() {
  if (!mexicoReady()) {
    const n = countSet('air');
    say([{name:'Captain Sol', text: n < 7
      ? 'The Mexico sign is quiet. Squishies on board: ' + n + ' / 7.'
      : 'Come through security in your tall coats, then the sign will flash.'}]);
    return;
  }
  finishLevel();
}
function tryBus() {
  if (countSet('park') < 7 || !state.flags.busArrived) {
    say([{name:buddy(), text:'No bus yet. Park squishies: ' + countSet('park') + ' / 7.'}]);
    return;
  }
  sfx('bus');
  finishLevel();
}
function tryDisguise() {
  if (state.flags.disguised) {
    say([{name:buddy(), text:'We are already tall inside the coats.'}]);
    return;
  }
  if (!state.items.coatMaple || !state.items.coatButton) {
    say([{name:'Ava', text:"We need Ms Maple's coat and Miss Button's coat from school."}]);
    return;
  }
  openDisguise(() => {
    closeModal();
    state.flags.disguised = true;
    save();
    say([{name:'Darcey', text:'Axel is on Ava. Hallie is on me. The coats hide the wiggle. We look like two grown-ups!'}]);
  });
}

function station(id, x, y, label, squishId, openFn, drawFn) {
  return prop({
    id, x, y, range:78,
    prompt() { return squishId && state.squishies[squishId] ? 'Again' : label; },
    sparkle() { return !!(squishId && !state.squishies[squishId]); },
    use: openFn,
    draw(g) {
      if (drawFn) drawFn(g, x, y);
      if (squishId && !state.squishies[squishId]) drawSquishy(g, x + 34, y - 8, squishId, 0.72);
      drawLabel(g, x, y + 40, label);
    }
  });
}
function rareChest(id, x, y, squishId, label, openFn) {
  return prop({
    id, x, y, range:78,
    prompt() { return state.squishies[squishId] ? 'Again' : label; },
    sparkle() { return !state.squishies[squishId]; },
    use: openFn,
    draw(g) {
      drawChest(g, x, y, !!state.squishies[squishId]);
      if (!state.squishies[squishId]) drawSquishy(g, x, y - 48, squishId, 0.85);
    }
  });
}

function walkable(room, x, y) {
  if (x < 14 || y < 14 || x > room.w - 14 || y > room.h - 14) return false;
  return !hits(x, y, 12, room.solids);
}
function nearPoint(room, e) {
  const range = e.range || 80;
  for (let r = 0; r <= range; r += 16) {
    const steps = r === 0 ? 1 : 10;
    for (let a = 0; a < steps; a++) {
      const ang = a / steps * Math.PI * 2;
      const x = e.x + Math.cos(ang) * r;
      const y = e.y + Math.sin(ang) * r;
      if (walkable(room, x, y)) return {x, y};
    }
  }
  return null;
}
function canReach(room, x0, y0, x1, y1) {
  if (Math.hypot(x0 - x1, y0 - y1) <= 40 && walkable(room, x0, y0)) return true;
  const step = 16;
  const key = (x, y) => Math.round(x / step) + ',' + Math.round(y / step);
  const q = [[x0, y0]];
  const seen = new Set([key(x0, y0)]);
  const dirs = [[step,0],[-step,0],[0,step],[0,-step],[step,step],[step,-step],[-step,step],[-step,-step]];
  let head = 0;
  while (head < q.length && q.length < 7000) {
    const cur = q[head++];
    if (Math.hypot(cur[0] - x1, cur[1] - y1) <= 42) return true;
    for (const d of dirs) {
      const nx = cur[0] + d[0], ny = cur[1] + d[1];
      const k = key(nx, ny);
      if (seen.has(k) || !walkable(room, nx, ny)) continue;
      seen.add(k);
      q.push([nx, ny]);
    }
  }
  return false;
}
function selfTest() {
  const prev = state;
  state = blankState('ava');
  const errors = [];
  for (const [id, room] of Object.entries(ROOMS)) {
    const start = room.spawns.default;
    for (const [name, sp] of Object.entries(room.spawns)) {
      if (!walkable(room, sp.x, sp.y)) errors.push('stuck spawn ' + id + '.' + name);
    }
    for (const e of room.entities) {
      try { if (e.prompt) e.prompt(); } catch (err) { errors.push('prompt ' + id + ' ' + e.id); }
      let reached = !start;
      const range = e.range || 80;
      for (let r = 0; r <= range && !reached; r += 18) {
        const steps = r === 0 ? 1 : 8;
        for (let a = 0; a < steps && !reached; a++) {
          const ang = a / steps * Math.PI * 2;
          const x = e.x + Math.cos(ang) * r;
          const y = e.y + Math.sin(ang) * r;
          if (walkable(room, x, y) && canReach(room, start.x, start.y, x, y)) reached = true;
        }
      }
      if (!reached) errors.push('unreachable ' + id + '.' + e.id);
      if (e.to && !ROOMS[e.to]) errors.push('bad door ' + e.to);
      if (e.to && e.spawn && (!ROOMS[e.to] || !ROOMS[e.to].spawns[e.spawn])) errors.push('bad spawn ' + e.to + ' ' + e.spawn);
    }
  }
  state = prev;
  return errors;
}

function screenToWorld(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  const x = (cx - rect.left) * (cssW / Math.max(1, rect.width));
  const y = (cy - rect.top) * (cssH / Math.max(1, rect.height));
  return {x: x / cam.scale + cam.x, y: y / cam.scale + cam.y};
}
function computeHover() {
  if (mode !== 'play' || dialog || modalOpen || !state) return null;
  const room = ROOMS[state.room];
  if (!room) return null;
  let best = null, bd = 1e9, text = '';
  for (const e of room.entities) {
    const p = e.prompt && e.prompt();
    if (!p) continue;
    const d = Math.hypot(e.x - state.px, e.y - state.py);
    if (d < (e.range || 80) && d < bd) { best = e; bd = d; text = p; }
  }
  return best ? {e:best, text} : null;
}

    if (!p) continue;
    const d = Math.hypot(ent.x - wpt.x, ent.y - wpt.y);

  if (best) {

function axis() {
  let x = 0, y = 0;
  if (held.left || keys.has('ArrowLeft') || keys.has('a') || keys.has('A')) x -= 1;

  if (held.up || keys.has('ArrowUp') || keys.has('w') || keys.has('W')) y -= 1;
  if (held.down || keys.has('ArrowDown') || keys.has('s') || keys.has('S')) y += 1;

}
function tryMove(dx, dy) {
  const room = ROOMS[state.room];

  if (hits(state.px, state.py, 12, room.solids)) state.px -= dx;
  state.py += dy;
  if (hits(state.px, state.py, 12, room.solids)) state.py -= dy;
}
function update(dt) {

      barkTimer = 26;
      const lines = [buddy() + ': I am right behind you!', 'Axel: Are we there yet?', 'Hallie: I like the colours.', kidName() + ': Sparkles mean look closer.'];
      if (state.level === 2) lines.push('Darcey: I want a turn on the swings!');
      if (state.level === 3) lines.push('Ava: Walk tall.');
      showToast(lines[Math.floor(Math.random() * lines.length)]);
    }
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    floats[i].y -= 26 * dt;
    floats[i].life -= dt;
    if (floats[i].life <= 0) floats.splice(i, 1);
  }
  hover = computeHover();
}
function updateCamera(room) {
  const zoom = Math.min(cssW / 560, cssH / 360);
  const fit = Math.min(cssW / room.w, cssH / room.h);
  const scale = Math.max(zoom, fit);
  const viewW = cssW / scale;
  const viewH = cssH / scale;
  let x = state.px - viewW / 2;
  let y = state.py - viewH * (state.flags.disguised ? 0.62 : 0.42);
  if (viewW >= room.w) x = (room.w - viewW) / 2;
  else x = clamp(x, 0, room.w - viewW);
  if (viewH >= room.h) y = (room.h - viewH) / 2;
  else y = clamp(y, 0, room.h - viewH);
  cam = {x, y, scale};
}
function drawRoomBg(g, room) {
  if (room.outdoor) {
    const sky = g.createLinearGradient(0, 0, 0, 170);
    sky.addColorStop(0, '#7ec8ff');
    sky.addColorStop(1, '#d9f5c8');
    g.fillStyle = sky;
    g.fillRect(0, 0, room.w, 170);
    g.fillStyle = room.floor || '#69c15f';
    g.fillRect(0, 150, room.w, room.h);
    g.fillStyle = '#ffe14a';
    g.beginPath(); g.arc(80, 48, 26, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,.9)';
    for (let i = 0; i < 3; i++) {
      const cx = ((i * 320 + time * 16) % (room.w + 140)) - 70;
      g.beginPath(); g.ellipse(cx, 36 + (i % 2) * 16, 34, 14, 0, 0, Math.PI * 2); g.fill();
    }
  } else {
    g.fillStyle = room.floor || '#f0d8b0';
    g.fillRect(0, 0, room.w, room.h);
    g.strokeStyle = 'rgba(90,60,30,.08)';
    g.lineWidth = 1;
    for (let x = 0; x < room.w; x += 48) {
      for (let y = 60; y < room.h; y += 48) g.strokeRect(x + 2, y, 44, 44);
    }
    g.fillStyle = '#fff8ee';
    g.fillRect(0, 0, room.w, 44);
    g.fillStyle = '#e2b56a';
    g.fillRect(0, 44, room.w, 8);
  }
  if (room.paint) room.paint(g);
}
function renderWorld(g) {
  const room = ROOMS[state.room];
  if (!room) return;
  updateCamera(room);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = room.outdoor ? '#8ecbff' : '#d9c39a';
  g.fillRect(0, 0, cssW, cssH);
  g.setTransform(dpr * cam.scale, 0, 0, dpr * cam.scale, -cam.x * cam.scale * dpr, -cam.y * cam.scale * dpr);
  g.lineJoin = 'round';
  g.lineCap = 'round';
  drawRoomBg(g, room);
  if (room.hedges) {
    for (const h of room.hedges) {
      roundRect(g, h.x, h.y, h.w, h.h, 8);
      fillStroke(g, '#2f8f45');
    }
  }
  const sprites = [];
  for (const e of room.entities) {
    sprites.push({
      y: e.solid ? e.solid.y + e.solid.h : e.y,
      draw() {
        e.draw(g);
        if (e.sparkle && e.sparkle()) drawStar(g, e.x, e.y - 46, 8, '#fff4b0');
      }
    });
  }
  partySprites().forEach(p => sprites.push(p));
  sprites.sort((a, b) => a.y - b.y);
  sprites.forEach(s => s.draw(g));
  if (hover && !dialog) {
    g.strokeStyle = '#ffcf33';
    g.lineWidth = 3;
    g.beginPath();
    g.arc(hover.e.x, hover.e.y, 26 + Math.sin(time * 5) * 2, 0, Math.PI * 2);
    g.stroke();
  }
  g.font = '800 16px Trebuchet MS, sans-serif';
  g.textAlign = 'center';
  for (const f of floats) {
    g.globalAlpha = Math.max(0, Math.min(1, f.life));
    g.fillStyle = f.color;
    g.fillText(f.text, f.x, f.y);
  }
  g.globalAlpha = 1;
  if (DEBUG) {
    g.fillStyle = 'rgba(255,0,0,.25)';
    room.solids.forEach(s => g.fillRect(s.x, s.y, s.w, s.h));
  }
}
function renderAttract(g, w, h) {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#8ecbff';
  g.fillRect(0, 0, w, h);
  g.fillStyle = '#69c15f';
  g.fillRect(0, h * 0.62, w, h);
  g.fillStyle = '#ffe14a';
  g.beginPath(); g.arc(w - 70, 60, 28, 0, Math.PI * 2); g.fill();
  const sc = Math.min(1.3, w / 800);
  PLAYABLE.forEach((id, i) => {
    const x = w * (0.18 + i * 0.2);
    drawKid(g, x, h * 0.62, id, Math.sin(time * 0.4) > 0 ? 'right' : 'left', Math.sin(time * 6 + i) * 2, sc, false, false);
  });
}
function renderBeach(g, w, h) {
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#8ecbff';
  g.fillRect(0, 0, w, h * 0.45);
  g.fillStyle = '#2f6fed';
  g.fillRect(0, h * 0.45, w, h * 0.2);
  g.fillStyle = '#f0d59a';
  g.fillRect(0, h * 0.62, w, h);
  g.fillStyle = '#ffe14a';
  g.beginPath(); g.arc(80, 70, 30, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#3aaa6a';
  g.fillRect(w - 90, h * 0.5, 16, 70);
  g.beginPath(); g.ellipse(w - 70, h * 0.48, 28, 16, 0, 0, Math.PI * 2); g.fill();
  const sc = Math.min(1.2, w / 900);
  PLAYABLE.forEach((id, i) => drawKid(g, w * (0.2 + i * 0.12), h * 0.78, id, 'right', 0, sc, false, false));
  SQUISHIES.forEach((s, i) => drawSquishy(g, 30 + (i % 11) * (w / 12), h * 0.9, s.id, 0.55));
}
function updateHud() {
  const hud = document.getElementById('hud');
  const bar = document.getElementById('bar');
  if (!state || mode !== 'play') hud.classList.add('hidden');
  else {
    hud.classList.remove('hidden');
    document.getElementById('who').textContent = KIDS[state.leader].name + ' leads';
    document.getElementById('roompill').textContent = (ROOMS[state.room] && ROOMS[state.room].name) || '';
    const dots = set => SQUISHIES.filter(s => s.set === set).map(s =>
      '<i class="' + (state.squishies[s.id] ? 'on' : '') + '" style="background:' + s.hex + '"></i>').join('');
    document.getElementById('sc-school').innerHTML = 'School ' + countSet('school') + '/7 ' + dots('school');
    document.getElementById('sc-park').innerHTML = 'Park ' + countSet('park') + '/7 ' + dots('park');
    document.getElementById('sc-air').innerHTML = 'Airport ' + countSet('air') + '/7 ' + dots('air');
    document.getElementById('sc-star').textContent = 'Stars ' + (state.stars || 0) + '/9';
    document.getElementById('objective').textContent = objective();
    const go = document.getElementById('go');
    if (dialog) { go.textContent = 'Next'; go.classList.remove('dim'); }
    else if (hover) { go.textContent = hover.text; go.classList.remove('dim'); }
    else { go.textContent = 'Look'; go.classList.add('dim'); }
    document.getElementById('btn-mute').textContent = state.muted ? 'Off' : 'On';
  }
  bar.classList.toggle('hidden', mode !== 'play' || modalOpen);
}
function render() {
  const g = ctx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, cssW, cssH);
  if (mode === 'play') renderWorld(g);
  else if (mode === 'ending') renderBeach(g, cssW, cssH);
  else renderAttract(g, cssW, cssH);
  updateHud();
}
function resize() {
  const r = document.getElementById('stage').getBoundingClientRect();
  cssW = Math.max(320, r.width || 960);
  cssH = Math.max(180, r.height || 540);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.style.width = (r.width || cssW) + 'px';
  canvas.style.height = (r.height || cssH) + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
}
function onKeyDown(e) {
  const k = e.key;
  const moveKey = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','a','A','w','W','s','S','d','D'].includes(k);
  if (moveKey) { keys.add(k); e.preventDefault(); return; }
  if (e.repeat) return;
  if (k === 'Escape') {
    if (dialog) { dialog = null; renderDialog(); }
    else if (modalOpen && mode === 'play') closeModal();
    return;
  }
  if (k === 'e' || k === 'E') { e.preventDefault(); onGo(); return; }
  if (k === ' ' || k === 'Enter') {
    if (dialog) { e.preventDefault(); advanceDialog(); return; }
    if (document.activeElement && document.activeElement.closest && document.activeElement.closest('button')) return;
    e.preventDefault();
    onGo();
    return;
  }
  if (mode !== 'play' || modalOpen) return;
  if (k === 'i' || k === 'I') openBag();
  if (k === 'g' || k === 'G') openGoals();
  if (k === 'p' || k === 'P') openPlan();
  if (k === 'm' || k === 'M') { state.muted = !state.muted; save(); }
}
function bind() {
  document.getElementById('d-next').addEventListener('click', advanceDialog);
  document.getElementById('go').addEventListener('click', onGo);
  document.getElementById('btn-goals').addEventListener('click', () => { if (mode === 'play') openGoals(); });
  document.getElementById('btn-bag').addEventListener('click', () => { if (mode === 'play') openBag(); });
  document.getElementById('btn-plan').addEventListener('click', () => { if (mode === 'play') openPlan(); });
  document.getElementById('btn-mute').addEventListener('click', () => { if (!state) return; state.muted = !state.muted; save(); });
  document.querySelectorAll('#dpad button').forEach(btn => {
    const dir = btn.dataset.dir;
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      held[dir] = true;
      if (btn.setPointerCapture) btn.setPointerCapture(e.pointerId);
    });
    btn.addEventListener('pointerup', () => { held[dir] = false; });
    btn.addEventListener('pointercancel', () => { held[dir] = false; });
  });
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', e => keys.delete(e.key));
  window.addEventListener('blur', freezeInput);
  canvas.addEventListener('pointerup', onTap);
  document.getElementById('who').addEventListener('click', () => {
    if (mode !== 'play' || !state) return;
    const names = PLAYABLE.filter(id => id !== state.leader).map(id => KIDS[id].name);
    say([{name:kidName(), text:names.join(', ') + ' are right behind me.'}]);
  });
  ['sc-school','sc-park','sc-air','sc-star'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => { if (mode === 'play') openAlbum(); });
  });
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('stage'));
}
function launchShot() {
  state = blankState(params.get('leader') || 'ava');
  const grant = params.get('grant') || '';
  if (grant === 'school' || grant === 'park' || grant === 'all') {
    grantSet('school');
    state.items.plan = true; state.items.coatMaple = true; state.items.coatButton = true;
    state.items.spades = 2; state.flags.teacherLocked = true; state.flags.planRead = true;
  }
  if (grant === 'park' || grant === 'all') { grantSet('park'); state.flags.busArrived = true; }
  if (grant === 'all') grantSet('air');
  if (params.get('plan')) state.items.plan = true;
  if (params.get('disguise')) { state.flags.disguised = true; state.items.coatMaple = true; state.items.coatButton = true; }
  if (params.get('security')) state.flags.securityPassed = true;
  const roomId = params.get('room') || 'classroom';
  const room = ROOMS[roomId] || ROOMS.classroom;
  const sp = room.spawns[params.get('spawn') || 'default'] || room.spawns.default;
  state.room = room.id;
  state.px = sp.x; state.py = sp.y;
  state.level = Number(params.get('level') || room.level || 1);
  if (params.get('tunnel')) state.flags.tunnelOpen = true;
  refreshDerived();
  resetTrail();
  mode = 'play';
  closeModal();
  if (params.get('open') === 'plan') openPlan();
  if (params.get('mini') === 'bells') openBells();
  if (params.get('mini') === 'memory') openMemory();
  if (params.get('ending')) { state.unlocked = 4; grantSet('school'); grantSet('park'); grantSet('air'); showEnding(); }
}
function frame(now) {
  try {
    const dt = Math.min(0.05, (now - lastFrame) / 1000 || 0);
    lastFrame = now;
    time += dt;
    update(dt);
    render();
  } catch (err) {
    const elErr = document.getElementById('err');
    elErr.style.display = 'block';
    elErr.textContent = 'Something went wobbly. Please refresh the page.';
    console.error(err);
    return;
  }
  requestAnimationFrame(frame);
}
function init() {
  state = blankState('ava');
  state.unlocked = unlockLevel();
  ROOMS = buildRooms();
  bind();
  resize();
  if (params.has('autotest')) {
    const errors = selfTest().concat(logicTest());
    const pre = document.createElement('pre');
    pre.id = 'autotest';
    pre.textContent = errors.length ? errors.join('\n') : 'OK';
    document.body.append(pre);
  }
  window.SQ = {
    get state(){ return state; },
    rooms: () => ROOMS,
    enter, collect, selfTest, logicTest, digBlockers, begin, beginChapter
  };
  if (params.get('play') || params.get('ending')) launchShot();
  else openTitle();
  lastFrame = performance.now();
  requestAnimationFrame(frame);
}
window.addEventListener('error', e => {
  const elErr = document.getElementById('err');
  elErr.style.display = 'block';
  elErr.textContent = e.message + ' @' + e.lineno;
});
init();
</script>
